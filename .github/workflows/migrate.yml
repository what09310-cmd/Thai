name: Migrate database

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no write)"
        type: boolean
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-scraper.txt

      - name: Run migrate.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/migrate.py ${{ inputs.dry_run && '--dry-run' || '' }}
