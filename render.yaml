databases:
  - name: renthub-db
    databaseName: renthub
    user: renthub
    plan: free

services:
  - type: web
    name: renthub-tracker-api
    runtime: python
    plan: free
    # requirements-api.txt et non requirements.txt: le service n'a besoin ni
    # du scraper (scrapling, playwright) ni des outils d'export (pandas).
    buildCommand: pip install -r requirements-api.txt
    startCommand: python -m uvicorn src.api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: renthub-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      # Render est le seul proxy devant l'application: l'adresse du client
      # est la derniere de X-Forwarded-For (voir src/api/main.py::_client_key).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: CORS_ALLOW_ORIGINS
        value: "https://what09310-cmd.github.io"
      - key: TZ
        value: "Asia/Bangkok"
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_USERNAME
        value: admin
      - key: SITE_PASSWORD
        generateValue: true
