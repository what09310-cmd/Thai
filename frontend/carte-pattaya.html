<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiMonth — Carte Pattaya</title>
<meta property="og:title" content="ThaiMonth — Carte Pattaya">
<meta property="og:description" content="Toutes les annonces actives géolocalisées à Pattaya">
<meta property="og:image" content="/static/logo.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/static/css/city-map.css">
<link rel="stylesheet" href="/static/css/common.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  .pin-icon{
    width:14px;height:14px;border-radius:50%;
    background:#facc15;border:2px solid #0a0a0a;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<header>
  <h1>ThaiMonth — Pattaya</h1>
  <span class="subhead">Échantillon : annonces actives du district de Bang Lamung (Pattaya) géolocalisées</span>
  <nav>
    <a href="/carte-thailande.html">Carte Thaïlande ↗</a>
    <a href="/carte-phuket.html">Carte Phuket ↗</a>
    <a href="/carte-bangkok.html">Carte Bangkok ↗</a>
  </nav>
</header>

<main>
  <section id="map">
    <div id="leaflet-map"></div>
    <div class="controls">
      <button id="monthlyToggle" class="filter-btn">🗓️ Contrat 1 mois uniquement</button>
      <div class="price-filter">
        <div class="price-filter-label"><span id="priceMinLabel">0 ฿</span> – <span id="priceMaxLabel">0 ฿</span></div>
        <div class="range-slider">
          <div class="range-track"></div>
          <div class="range-track-fill" id="rangeFill"></div>
          <input type="range" id="priceMin" min="0" max="0" step="500" value="0">
          <input type="range" id="priceMax" min="0" max="0" step="500" value="0">
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/map.js"></script>
<script>
// Parametres de cette ville, lus par /static/js/city-map.js.
const CITY = { name: "Pattaya", query: "district=Bang Lamung", cluster: false, pinSize: 14, pageLimit: 200 };
</script>
<script src="/static/js/city-map.js"></script>
</body>
</html>
