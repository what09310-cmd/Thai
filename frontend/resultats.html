<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiMonth — Vos résultats</title>
<meta property="og:title" content="ThaiMonth — Vos résultats">
<meta property="og:description" content="Les logements qui correspondent à votre recherche, sur la carte.">
<meta property="og:image" content="/static/logo.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/css/map.css">
<link rel="stylesheet" href="/static/css/modal.css">
<link rel="stylesheet" href="/static/css/common.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #faf8f4;
    --surface:  #ffffff;
    --card:     #ffffff;
    --border:   #e9e4da;
    --accent:   #5046f5;
    --accent-ink: #ffffff;
    --brand-lime: #c7ef6c;
    --brand-gold: #e8b765;
    --green:    #2f9e44;
    --blue:     #5046f5;
    --purple:   #7950f2;
    --text:     #14130f;
    --muted:    #6c6660;
    --dim:      #9b948b;
    --focus:    #5046f5;
    --mono:     'Plus Jakarta Sans', system-ui, sans-serif;
    --sans:     'Plus Jakarta Sans', system-ui, sans-serif;
    --r-pill:   9999px;
    --r-card:   20px;
    --r-ctl:    12px;
    --sky-1:    #cfe8b8;
    --sky-2:    #dcd6f9;
    --sky-3:    #cde8f4;
  }

  /* "Votre recherche": premiere section des .controls (map.css), propre a
     cette page -- rappelle les criteres du tunnel /789 et permet d'y
     retourner. Le budget/la duree choisis n'y filtrent pas la carte (voir
     le commentaire pres de LOCATION_QUERY) : la ville, elle, est deja
     appliquee cote serveur. */
  .search-summary { font-size: 12.5px; color: var(--text); line-height: 1.5; }
  .search-summary strong { color: var(--accent); }
  .edit-search-link {
    display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700;
    color: var(--accent); text-decoration: none;
  }
  .edit-search-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <a class="logo" href="/" aria-label="ThaiMonth">
    <span class="logo-thai">Thai</span><span class="logo-month">Month</span>
  </a>
  <a class="header-list" href="/payant.html">Débloquer les contacts</a>
</header>

<main>
  <section id="map">
    <div id="leaflet-map"></div>
    <div class="controls" id="controls">
      <button type="button" class="controls-toggle" id="controls-toggle" aria-expanded="true" aria-controls="controls">
        <span>Filtres</span><span class="controls-toggle-icon">▾</span>
      </button>
      <div class="filter-section">
        <div class="filter-label">Votre recherche</div>
        <div class="search-summary" id="search-summary">—</div>
        <a class="edit-search-link" href="/789">Modifier ma recherche</a>
      </div>
      <div class="filter-section">
        <div class="filter-label">Résultats</div>
        <div class="budget-values"><span id="result-count">— annonces</span></div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Budget (€ / mois)</div>
        <div class="budget-values">
          <span id="budget-min-label">10 €</span>
          <span id="budget-max-label">500 €+</span>
        </div>
        <div class="range-slider" id="f-budget">
          <div class="range-track"></div>
          <div class="range-fill" id="budget-fill"></div>
          <input type="range" id="budget-min" min="10" max="500" step="10" value="10">
          <input type="range" id="budget-max" min="10" max="500" step="10" value="500">
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Durée du séjour</div>
        <div class="chip-group" id="f-duration">
          <button type="button" class="chip" data-value="1 mois">1 mois</button>
          <button type="button" class="chip" data-value="3 mois">3 mois</button>
          <button type="button" class="chip" data-value="6 mois">6 mois</button>
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Équipements</div>
        <div class="chip-group" id="f-amenities">
          <button type="button" class="chip" id="chip-new">🆕 New</button>
          <button type="button" class="chip" data-value="Pool">🏊 Pool</button>
          <button type="button" class="chip" data-value="Fitness">🏋️ Fitness</button>
          <button type="button" class="chip" data-value="Desk">🖥️ Desk</button>
          <button type="button" class="chip" data-value="In-room WIFI">📶 WIFI</button>
          <button type="button" class="chip" data-value="Television">📺 TV</button>
          <button type="button" class="chip" data-value="Beauty Salon in Building">💇 Beautiful</button>
          <button type="button" class="chip" data-value="Parking">🅿️ Parking</button>
          <button type="button" class="chip" data-value="Smoking">🚬 Smoking</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-body" role="dialog" aria-modal="true" aria-label="Détail de l'annonce" tabindex="-1"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox-overlay" id="lightbox-overlay" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Fermer">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" onclick="navigateLightbox(-1)" aria-label="Photo précédente">‹</button>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" onclick="navigateLightbox(1)" aria-label="Photo suivante">›</button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="" draggable="false" oncontextmenu="return false">
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/modal.js"></script>
<script src="/static/js/map.js"></script>
<script src="/static/js/thai-map.js"></script>
<script>
  // Chaque ville du tunnel /789 correspond au filtre serveur /listings deja
  // utilise par les cartes publiques (carte-bangkok/pattaya/phuket.html):
  // province pour Bangkok/Phuket/Chiang Mai, district pour Pattaya (dont la
  // province reelle, Chonburi, n'est pas celle affichee au visiteur).
  // "other" (5e choix du tunnel) ne correspond a aucune province precise:
  // pas de filtre, la carte reste nationale.
  const LOCATION_FIELD = {
    bangkok: ["province", "Bangkok"],
    phuket: ["province", "Phuket"],
    chiang_mai: ["province", "Chiang Mai"],
    pattaya: ["district", "Bang Lamung"],
  };

  const LOCATION_LABELS = {
    bangkok: "Bangkok", pattaya: "Pattaya", phuket: "Phuket",
    chiang_mai: "Chiang Mai", other: "Toute la Thaïlande",
  };
  const BUDGET_LABELS = {
    under_10k: "Moins de 260 €", "10k_20k": "260 – 520 €",
    "20k_30k": "520 – 780 €", "30k_plus": "780 €+",
  };
  const DURATION_LABELS = {
    "1_month": "1 mois", "3_months": "3 mois",
    "6_months": "6 mois", "12_months_plus": "12 mois+",
  };

  function readCriteria() {
    try {
      const raw = sessionStorage.getItem("tm_search_criteria");
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      return null;
    }
  }

  const criteria = readCriteria();
  if (!criteria) {
    window.location.href = "/789";
  } else {
    // Lu par thai-map.js::loadAds() (typeof LOCATION_QUERY !== "undefined"):
    // memes filtres province/district que city-map.js, appliques ici en plus
    // du filtre budget/duree deja existant sur cette carte. Le budget/la
    // duree du tunnel restent seulement informatifs (unites incompatibles
    // avec le slider EUR existant, voir le compte-rendu d'analyse) --
    // l'utilisateur peut affiner lui-meme avec les controles ci-dessous.
    const field = LOCATION_FIELD[criteria.location];
    // `var`, pas `const`: doit rester lisible via `typeof LOCATION_QUERY`
    // dans thai-map.js sans jamais avoir ete declaree sur vip.html/
    // carte-thailande.html -- une simple affectation suffirait aussi, mais
    // `var` documente que c'est une variable globale volontaire.
    var LOCATION_QUERY = field ? `${field[0]}=${encodeURIComponent(field[1])}` : "";

    // SHOW_LOCK_BUTTONS est deja declaree avec `let` dans map.js (charge
    // avant ce script): une simple affectation modifie ce `let` partage,
    // la re-declarer ici avec `let`/`const` lancerait "already declared".
    SHOW_LOCK_BUTTONS = true;

    document.getElementById("search-summary").innerHTML =
      `<strong>${esc(LOCATION_LABELS[criteria.location] || "—")}</strong>` +
      (criteria.budget_label ? ` · ${esc(criteria.budget_label)}` : "") +
      (criteria.duration_label ? ` · ${esc(criteria.duration_label)}` : "");

    loadAds();
  }
</script>
</body>
</html>
