<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiMonth Tracker</title>
<meta property="og:title" content="ThaiMonth Tracker">
<meta property="og:description" content="Suivi des annonces de location en Thaïlande">
<meta property="og:image" content="/static/logo.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #faf8f4;
    --surface:  #ffffff;
    --card:     #ffffff;
    --border:   #e9e4da;
    --accent:   #5046f5;
    --accent-ink: #ffffff;
    --brand-lime: #c7ef6c;
    --brand-gold: #e8b765;
    --blue:     #5046f5;
    --green:    #2f9e44;
    --red:      #e03131;
    --purple:   #7950f2;
    --text:     #14130f;
    --muted:    #6c6660;
    --dim:      #9b948b;
    --focus:    #5046f5;
    --mono:     'Plus Jakarta Sans', system-ui, sans-serif;
    --sans:     'Plus Jakarta Sans', system-ui, sans-serif;
    --r-pill:   9999px;
    --r-card:   20px;
    --r-ctl:    12px;
    --sky-1:    #cfe8b8;
    --sky-2:    #dcd6f9;
    --sky-3:    #cde8f4;
  }

  body {
    background: var(--sky-2);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
  }

  /* Ciel : un seul degrade fixe derriere la page (::after) et une bande de
     135px par-dessus le contenu (::before) qui masque ce qui passe sous le
     header. Les deux partagent la meme taille pour se superposer pile. */
  body::before, body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    pointer-events: none;
    background: linear-gradient(165deg,
      var(--sky-1) 0%, var(--sky-2) 46%, var(--sky-3) 100%) no-repeat;
    background-size: 100vw 100vh;
  }
  body::after { bottom: 0; z-index: -1; }
  body::before { height: 135px; z-index: 80; }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 8px;
    z-index: 100;
    width: calc(100% - 40px);
    max-width: 780px;
    margin: 8px auto 0;
    padding: 9px 10px 9px 22px;
    background: #1d3c10;
    border-radius: var(--r-pill);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    box-shadow: 0 10px 28px rgba(29,60,16,.22);
  }

  .logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    text-decoration: none;
    font-family: var(--sans);
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.6px;
    line-height: 1;
  }
  .logo-thai { color: var(--brand-lime); }
  .logo-month { color: var(--brand-gold); }

  .header-map {
    background: var(--accent);
    color: #fff;
    border-radius: var(--r-pill);
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: filter .15s;
  }
  .header-map:hover { filter: brightness(1.12); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .hstat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 92px;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: var(--r-pill);
    background: rgba(255,255,255,.82);
    font-family: var(--sans);
    font-size: 10px;
    line-height: 1.15;
    text-align: center;
    color: var(--muted);
  }
  .hstat b {
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    line-height: 1.2;
  }

  .city-stats {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    flex-shrink: 0;
    margin-left: auto;
  }

  .city-total {
    flex-shrink: 0;
  }

  /* ── Barre de villes ── */
  .city-bar {
    position: sticky;
    top: 76px;
    margin: 10px 28px 0;
    z-index: 90;
    padding: 14px 18px;
    border: 1px solid rgba(255,255,255,.78);
    border-radius: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 26px rgba(50,45,90,.08);
  }
  .city-bar::-webkit-scrollbar { display: none; }


  .location-filters { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .location-filter { display:flex; align-items:center; gap:8px; }
  .city-select {
    min-width:240px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--r-pill); color:var(--text); font-family:var(--sans);
    font-size:13px; padding:9px 12px; outline:none; cursor:pointer;
  }
  .city-select:focus { border-color:var(--accent); }
  .city-select:disabled { opacity:.5; cursor:not-allowed; }

  .city-label {
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: .05em;
    color: var(--dim);
    white-space: nowrap;
    margin-right: 4px;
    flex-shrink: 0;
  }

  .btn-new24h {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 9px 14px; border-radius: var(--r-pill);
    border: 1px solid var(--border); background: var(--card);
    color: var(--muted); font-family: var(--sans);
    font-size: 13px; font-weight: 500; cursor: pointer;
    white-space: nowrap; flex-shrink: 0; transition: all .15s;
  }
  .btn-new24h:hover { border-color: var(--purple); color: var(--text); }
  .btn-new24h.active { background: var(--purple); border-color: var(--purple); color: #fff; font-weight: 700; }
  .btn-new24h .new24h-count { font-family: var(--mono); font-size: 10px; opacity: .75; }


  /* ── Layout ── */
  .shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 101px);
    padding-top: 18px;
  }

  /* ── Sidebar ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    position: sticky;
    /* 76px (haut de la barre) + sa hauteur + 10px de marge */
    top: calc(86px + var(--city-bar-h, 74px));
    max-height: calc(100vh - 86px - var(--city-bar-h, 74px));
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .filter-section { display: flex; flex-direction: column; gap: 9px; }

  .filter-label {
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .filter-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
    transition: border-color .15s;
  }
  .filter-input:focus { border-color: var(--accent); }

  .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .slider-wrap { display: flex; flex-direction: column; gap: 6px; }
  .slider-wrap input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    accent-color: var(--accent);
    cursor: pointer;
  }
  .slider-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    cursor: pointer;
  }
  .slider-wrap input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    cursor: pointer;
  }
  .slider-info {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }
  .slider-info #slider-val { color: var(--accent); font-weight: 700; }

  /* ── Filtres : chips ── */
  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip { position: relative; display: inline-flex; cursor: pointer; }
  .chip input { position: absolute; opacity: 0; width: 0; height: 0; }

  .chip-label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--r-pill);
    background: var(--card);
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    user-select: none;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .1s;
  }
  .chip:hover .chip-label { border-color: var(--accent); color: var(--text); }
  .chip:active .chip-label { transform: scale(.97); }
  .chip input:checked + .chip-label {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 3px 10px rgba(80,70,245,.28);
  }
  .chip input:focus-visible + .chip-label { outline: 2px solid var(--focus); outline-offset: 2px; }

  .chip-monthly input:checked + .chip-label { background: var(--green); border-color: var(--green); box-shadow: 0 3px 10px rgba(47,158,68,.28); }
  .chip-3month input:checked + .chip-label { background: var(--blue); border-color: var(--blue); box-shadow: 0 3px 10px rgba(80,70,245,.28); }
  .chip-6month input:checked + .chip-label { background: var(--purple); border-color: var(--purple); box-shadow: 0 3px 10px rgba(121,80,242,.28); }

  #contract-filter-section .chip-group .chip { flex: 1 1 0; }
  #contract-filter-section .chip-label { width: 100%; justify-content: center; }

  .chip-equip { row-gap: 8px; }
  .chip-equip .chip { flex: 1 1 calc(50% - 4px); }
  .chip-equip .chip-label { width: 100%; justify-content: flex-start; }

  .btn-reset {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: var(--r-pill);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: all .15s;
    margin-top: 4px;
  }
  .btn-reset:hover { border-color: var(--red); color: var(--red); background: rgba(224,49,49,.06); }

  /* ── Main ── */
  .main {
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .result-info {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .result-info b { color: var(--accent); font-size: 14px; }

  .sort-select {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    cursor: pointer;
  }

  /* ── Grille ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(20,19,15,.10);
  }

  .card-img {
    height: 150px;
    background: var(--border);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    -webkit-user-drag: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .card-img .no-img {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: var(--muted);
  }

  /* Filigrane texte "ThaiMonth" (memes couleurs que le logo de l'en-tete):
     motif repete sur toute la photo + pastille pleine en bas a droite. */
  .wm-tile{
    position:absolute;inset:-40%;display:flex;flex-wrap:wrap;gap:6px 10px;
    align-content:space-around;justify-content:space-around;
    transform:rotate(-18deg);pointer-events:none;user-select:none;opacity:.9
  }
  .wm-tile span{
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.4px;
    white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.35)
  }
  .wm-thai{ color:var(--brand-lime) }
  .wm-month{ color:var(--brand-gold) }
  .wm-badge{
    position:absolute;right:10px;bottom:10px;pointer-events:none;user-select:none;
    background:#1d3c10;border-radius:var(--r-pill);padding:6px 13px;
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.4px;
    line-height:1;box-shadow:0 3px 10px rgba(20,19,15,.35)
  }
  .modal-gallery-item .wm-tile span{ font-size:17px }
  .modal-gallery-item .wm-badge{ font-size:18px;padding:8px 16px;right:12px;bottom:12px }

  .modal-gallery {
    display: flex;
    flex-shrink: 0;
    height: 220px;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    margin: 0 -18px 4px;
    padding: 0 18px;
  }
  .modal-gallery-item {
    position: relative;
    flex-shrink: 0;
    height: 220px;
    max-width: 85%;
    scroll-snap-align: start;
    overflow: hidden;
    border-radius: 8px;
  }
  .modal-gallery-item img {
    height: 220px;
    width: auto;
    max-width: 100%;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
    transform: scaleX(-1);
    -webkit-user-drag: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    pointer-events: none;
    cursor: default;
  }

  .badge {
    position: absolute;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    letter-spacing: .05em;
  }
  .badge-monthly { top: 8px; left: 8px; background: var(--green); color: #fff; }
  .badge-verified { top: 8px; right: 8px; background: var(--blue); color: #fff; }
  .badge-term-3 { background: var(--blue); color: #fff; }
  .badge-term-6 { background: var(--purple); color: #fff; }

  .card-badge-slot { padding: 8px 14px 0; height: 25px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; }

  .card-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

  .card-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-loc {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .loc-district {
    background: rgba(80,70,245,.10);
    color: var(--blue);
    border-radius: var(--r-pill);
    padding: 2px 9px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
  }
  .loc-province {
    font-size: 11px;
    color: var(--muted);
  }

  .card-contracts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-top: auto;
  }
  .cc {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    min-width: 0;
  }
  .cc-label {
    font-size: 9px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    margin-bottom: 0;
  }
  .cc-val {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.3;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  .cc-val.na { color: var(--muted); font-weight: 400; font-size: 11px; }

  .card-date {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
  }

  /* ── States ── */
  .state-box {
    display: flex; align-items: center; justify-content: center;
    height: 220px; color: var(--muted);
    font-family: var(--mono); font-size: 13px; gap: 10px;
    flex-direction: column;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Pagination ── */
  .pager {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 8px 0;
  }
  .pager button {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 11px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); }
  .pager button.on { border-color: var(--accent); color: var(--accent); }
  .pager button:disabled { opacity: .3; cursor: default; }

  /* ── Modal ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,19,15,.45);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    width: 100%; max-width: 600px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 18px;
  }

  .modal-top {
    display: flex; justify-content: flex-end; align-items: flex-start; gap: 12px;
  }
  .modal-close {
    background: none; border: 1px solid var(--border);
    border-radius: var(--r-pill); color: var(--muted);
    width: 28px; height: 28px; cursor: pointer;
    font-size: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 3px 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .tag.green { border-color: var(--green); color: var(--green); }

  .modal-contracts {
    display: grid; grid-template-columns: 1fr; gap: 8px;
  }
  .mc {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--r-ctl); padding: 13px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .mc-label {
    font-size: 9px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 0;
  }
  .mc-val {
    font-size: 13px; font-weight: 700;
    font-family: var(--mono); color: var(--accent);
  }
  .mc-val.na { color: var(--muted); font-weight: 400; font-size: 12px; }
  .mc-room-label {
    font-size: 10px; font-family: var(--mono); font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text); margin: 10px 0 -2px;
  }
  .mc-room-label:first-child { margin-top: 0; }
  .mc-room-group {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }

<script>
// La barre de villes passe sur deux lignes sous ~1550px : on publie sa

(() => {

const RENDER_API = "https://thai-month.onrender.com";
const API = window.location.origin.startsWith("file:") ? "http://localhost:8000"
          : window.location.hostname === "what09310-cmd.github.io" ? RENDER_API
          : window.location.origin;
const PER_PAGE = 30;

const LINE_ICON_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink:0"><rect width="24" height="24" rx="6" fill="#06C755"/><path fill="#fff" d="M12 5.5c-4.14 0-7.5 2.73-7.5 6.1 0 3.02 2.66 5.55 6.26 6.03.24.05.58.16.66.37.08.19.05.49.03.68l-.11.65c-.03.19-.15.75.65.41.8-.34 4.33-2.55 5.9-4.36 1.09-1.19 1.61-2.41 1.61-3.78 0-3.37-3.36-6.1-7.5-6.1Z"/></svg>`;
const WHATSAPP_ICON_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink:0"><rect width="24" height="24" rx="6" fill="#25D366"/><path fill="#fff" d="M12 5.3a6.7 6.7 0 0 0-5.72 10.18l-.78 2.85 2.92-.77A6.7 6.7 0 1 0 12 5.3Zm0 12.2a5.47 5.47 0 0 1-2.79-.76l-.2-.12-2.07.54.55-2.02-.13-.21a5.5 5.5 0 1 1 4.64 2.57Zm3.02-4.12c-.16-.08-.97-.48-1.12-.53-.15-.06-.26-.08-.37.08-.11.16-.42.53-.52.64-.1.11-.19.12-.36.04-.16-.08-.68-.25-1.3-.8-.48-.43-.8-.96-.9-1.12-.09-.16-.01-.25.07-.33.08-.07.16-.19.24-.28.08-.1.11-.16.16-.27.05-.11.03-.2-.01-.28-.05-.08-.37-.9-.51-1.23-.13-.32-.27-.28-.37-.28h-.31c-.11 0-.28.04-.42.2-.15.16-.55.54-.55 1.32s.57 1.53.65 1.64c.08.11 1.12 1.71 2.72 2.4.38.16.68.26.91.33.38.12.73.1 1-.06.31-.18.97-.4 1.1-.78.14-.39.14-.72.1-.79-.04-.07-.15-.11-.31-.19Z"/></svg>`;

// Icônes pour les 28 catégories d'équipements — voir src/normalizers/amenities.py.
const AMENITY_ICONS = {

let allData = [];
let filtered = [];
let page = 1;

let activeDistrict = "";
let onlyNew24h = false;
let featuredCity = "";
let activeRegion = "";
let districtCoords = {};
let addressCoords = {};

// ── Init ────────────────────────────────────────────────────────────

async function init() {
  await Promise.all([loadStats(), loadListings(), loadDistrictCoords(), loadAddressCoords()]);
}

// Points GPS de repli par quartier (subdistrict/district/province),
// pré-calculés hors-ligne via Nominatim — voir scripts/geocode_districts.py.
// Sert de dernier recours quand ni l'annonce ni son adresse complète n'ont
// de coordonnées, pour que le lien/carte Google Maps pointe toujours sur
// un vrai marqueur plutôt qu'une recherche texte approximative.
async function loadDistrictCoords() {
  const candidates = ["district_coords.json", `${API}/static/district_coords.json`];
  for (const url of candidates) {
    try {
      const r = await fetch(url);
      if (r.ok) { districtCoords = await r.json(); return; }
    } catch (e) {}
  }
}

// Points GPS par adresse complète (rue/route + quartier, quand RentHub la
// publie) — voir scripts/geocode_addresses.py. Plus précis que le centre
// de quartier: tombe près du bâtiment réel pour les annonces qui ont un
// nom de rue, sinon équivalent au fallback quartier.
async function loadAddressCoords() {
  const candidates = ["address_coords.json", `${API}/static/address_coords.json`];
  for (const url of candidates) {
    try {
      const r = await fetch(url);
      if (r.ok) { addressCoords = await r.json(); return; }
    } catch (e) {}
  }
}

async function loadStats() {
  try {
    const s = await fetch(`${API}/stats`).then(r => r.json());
    document.getElementById("h-total").textContent = s.total_active.toLocaleString();
    document.getElementById("h-monthly").textContent = s.monthly_contract_count.toLocaleString();
    document.getElementById("h-3month").textContent = s.three_month_contract_count.toLocaleString();
    document.getElementById("h-6month").textContent = s.six_month_contract_count.toLocaleString();

    // Comptages par ville dans les boutons
    const map = {};
    (s.by_province || []).forEach(r => { map[r.province] = r.count; });

    document.querySelectorAll(".city-btn[data-province]").forEach(btn => {
      const prov = btn.dataset.province;
      if (!prov) return;
      const count = map[prov];
      const key = prov.replace(/\s+/g, "");
      const el = document.getElementById("count-" + key);
      if (el && count) el.textContent = `(${count})`;
    });
  } catch(e) {}
}

async function loadListings() {
  showLoading();
  try {
    const limit = 500;
    let offset = 0;
    allData = [];

    // Charge toutes les pages de l'API afin de ne perdre aucune ville/annonce.
    while (true) {
      const r = await fetch(`${API}/listings?limit=${limit}&offset=${offset}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);

      const batch = await r.json();
      if (!Array.isArray(batch)) throw new Error("Réponse /listings invalide");

      allData.push(...batch);

      // Une page plus courte que "limit" signifie qu'il n'y a plus de résultats.
      if (batch.length < limit) break;

      offset += limit;
    }

    applyUrlParams();
    buildLocationMenus();
    _updateNew24hCount();
    _updateFeaturedCounts();
    applyFilters();
  } catch(e) {
    console.error(e);
    document.getElementById("grid-wrap").innerHTML =
      `<div class="state-box">❌ API inaccessible<br><small style="margin-top:6px;color:var(--muted)">Lancez uvicorn sur ${API}</small></div>`;
  }
}

// Pré-remplit les filtres depuis l'URL (ex: redirection depuis le
// formulaire de payant.html vers les annonces correspondantes).
function applyUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const city = params.get("city");
  const min = params.get("min");
  const max = params.get("max");
  const monthly = params.get("monthly");

  if (city) activeCity = city;
  if (min) document.getElementById("f-min").value = min;
  if (max) document.getElementById("f-max").value = max;
  if (monthly === "1") document.getElementById("f-monthly").checked = true;
}

function norm(v) {
  return String(v ?? "").trim();
}

// Regroupe les provinces à faible volume (<5 annonces) dans la province
// voisine la plus proche de la même région, pour alléger le menu Ville.
const PROVINCE_MERGE_MAP = {
  // Sud
  "Songkhla": "Surat Thani",
  "Nakhon Sri Thammarat": "Surat Thani",
  "Yala": "Surat Thani",
  "Krabi": "Phuket",
  "Ranong": "Phuket",
  "Prachaubkirikhan": "Ratchburi",
  // Ouest / Centre
  "Petchburi": "Ratchburi",
  "Samut Songkram": "Samut Sakhon",
  "Suphanburi": "Nakhon Pathom",
  "Lopburi": "Phra Nakhon Sri Ayutthaya",
  "Saraburi": "Phra Nakhon Sri Ayutthaya",
  "Nakhon Nayok": "Pathumthani",
  // Est
  "Prachinburi": "Chachoengsao",
  "Chonburi": "Pattaya",
  // Nord
  "Phitsanulok": "Lamphang",
  "Phrae": "Lamphang",
  "Lamphun": "Chiang Mai",
  // Isaan (nord-est)
  "Udon Thani": "Khon Kaen",
  "Nong Bua Lam Phu": "Khon Kaen",
  "Maha Sarakham": "Khon Kaen",
  "Sakon Nakhon": "Khon Kaen",
  "Roi Et": "Khon Kaen",
  "Surin": "Nakhon Ratchasima",
  "Chaiyaphum": "Nakhon Ratchasima",
  "Buri Ram": "Nakhon Ratchasima",
  "Ubon Ratchathani": "Nakhon Ratchasima",
  "Yasothon": "Nakhon Ratchasima",
  "Amnat Charoen": "Nakhon Ratchasima",
};

// Districts promus au rang de "ville" dans le menu, avec un nom plus
// parlant (ex: le district administratif "Bang Lamung" correspond à la
// zone touristique connue sous le nom de Pattaya).
const DISTRICT_AS_CITY = {
  "Bang Lamung": "Pattaya",
  "Ko Samui": "Ko Samui",
  "Hua Hin": "Hua Hin",
  "Ko Phangan": "Ko Phangan",
};

function rawProvinceOf(l) {
  return norm(l.city || l.province || "");
}

function cityOf(l) {
  const district = norm(l.district || "");
  for (const [from, to] of Object.entries(DISTRICT_AS_CITY)) {
    if (key(district).includes(key(from))) return to;
  }
  // Utilise la vraie ville si elle existe ; sinon retombe sur la province.
  const raw = rawProvinceOf(l);
  return PROVINCE_MERGE_MAP[raw] || raw;
}

// Regroupe les villes/provinces canoniques (retournées par cityOf) en 5
// grandes régions de Thaïlande, pour le filtre régional (bouton flottant).
const REGION_MAP = {
  // Centre (Bangkok + périphérie + Ouest)
  "Bangkok": "Centre",
  "Pathumthani": "Centre",
  "Samut Prakarn": "Centre",
  "Nonthaburi": "Centre",

function buildLocationMenus() {
  const citySelect = document.getElementById("city-select");
  const districtSelect = document.getElementById("district-select");
  if (!citySelect || !districtSelect) return;

  const cities = new Map();
  const districts = new Map();

  allData.forEach(l => {
    if (l.status !== "active") return;
    const city = cityOf(l);
    if (!city) return;
    const ck = key(city);

    if (!cities.has(ck)) {
      cities.set(ck, {name: city, count: 0});
      districts.set(ck, new Map());
    }
    cities.get(ck).count++;

    const district = districtOf(l);
    if (district) {
      const dm = districts.get(ck);
      const dk = key(district);
      if (!dm.has(dk)) dm.set(dk, {name: district, count: 0});
      dm.get(dk).count++;
    }
  });

  const totalActive = [...cities.values()].reduce((sum, c) => sum + c.count, 0);

  citySelect.innerHTML = "";
  const all = document.createElement("option");
  all.value = "";
  all.textContent = `Toutes les villes (${totalActive.toLocaleString("fr-FR")})`;
  citySelect.appendChild(all);

  [...cities.values()]
    .sort((a,b) => b.count - a.count)
    .forEach(c => {
      const o = document.createElement("option");
      o.value = c.name;
      o.textContent = `${c.name} (${c.count.toLocaleString("fr-FR")})`;
      citySelect.appendChild(o);
    });

  citySelect.value = activeCity;

  districtSelect.innerHTML = "";
  const allD = document.createElement("option");
  allD.value = "";
  allD.textContent = activeCity ? "Tous les quartiers" : "Sélectionnez d'abord une ville";
  districtSelect.appendChild(allD);

  const dm = districts.get(key(activeCity)) || new Map();
  [...dm.values()]
    .sort((a,b) => a.name.localeCompare(b.name, "fr", {sensitivity:"base"}))
    .forEach(d => {
      const o = document.createElement("option");
      o.value = d.name;
      o.textContent = `${d.name} (${d.count.toLocaleString("fr-FR")})`;
      districtSelect.appendChild(o);
    });

  districtSelect.disabled = !activeCity || dm.size === 0;
  districtSelect.value = activeDistrict;
}

function applyFilters() {
  const rawMin = document.getElementById("f-min").value;
  const rawMax = document.getElementById("f-max").value;
  // "0" est une valeur valide (≠ vide) : ne pas la faire retomber sur le
  // défaut via "|| ..." sinon "≤ 0 ฿" désactive silencieusement le filtre.
  const parsedMin = parseInt(rawMin);
  const parsedMax = parseInt(rawMax);
  const priceMin = rawMin === "" || isNaN(parsedMin) ? 0 : parsedMin;
  const priceMax = rawMax === "" || isNaN(parsedMax) ? Infinity : parsedMax;
  const monthlyOnly = document.getElementById("f-monthly").checked;
  const threeMonthOnly = document.getElementById("f-3month").checked;
  const sixMonthOnly = document.getElementById("f-6month").checked;
  const sort = document.getElementById("f-sort").value;

  const amenityFilters = [
    ["f-am-desk", "Desk"],
    ["f-am-wifi", "In-room WIFI"],
    ["f-am-smoking", "Smoking"],
    ["f-am-pool", "Pool"],
    ["f-am-fitness", "Fitness"],
    ["f-am-store", "Convenient Store"],
  ].filter(([id]) => document.getElementById(id).checked)
   .map(([, name]) => name);

  filtered = allData.filter(l => {
    if (l.status !== "active") return false;

    if (onlyNew24h) {
      const cutoff = Date.now() - 24 * 60 * 60 * 1000;
      if (new Date(l.first_seen_at || 0).getTime() < cutoff) return false;
    }

    if (activeCity && !key(cityOf(l)).includes(key(activeCity))) return false;
    if (activeDistrict && key(districtOf(l)) !== key(activeDistrict)) return false;

    if (featuredCity &&
        !key(cityOf(l)).includes(key(featuredCity)) &&
        !key(rawProvinceOf(l)).includes(key(featuredCity)) &&
        !key(districtOf(l)).includes(key(featuredCity))) return false;

    if (activeRegion && regionOf(l) !== activeRegion) return false;

    if (monthlyOnly && l.has_monthly_contract !== "true") return false;
    if (threeMonthOnly && contractNum(l.contract_3_month_raw) === null) return false;
    if (sixMonthOnly && contractNum(l.contract_6_month_raw) === null) return false;

    if (amenityFilters.length) {
      const amenities = l.amenities || [];
      if (!amenityFilters.every(a => amenities.includes(a))) return false;
    }

    if (monthlyOnly) {
      // Contrat 1 mois : on compare au prix réel de ce contrat (même valeur
      // que le tri "Prix"), pas à une plage qui chevaucherait juste la
      // fourchette demandée.
      const price = monthlyPrice(l);
      if (priceMin > 0 && price < priceMin) return false;
      if (priceMax < Infinity && price > priceMax) return false;
    } else {
      // On compare aux vrais prix des contrats disponibles (1/3/6 mois),
      // pas au champ "price_monthly_min/max" (prix d'en-tête de l'annonce
      // source) qui peut être vide même quand des contrats existent —
      // ça faisait passer le filtre max en no-op pour ces annonces.
      const contractPrices = [l.contract_monthly_raw, l.contract_3_month_raw, l.contract_6_month_raw]
        .map(contractNum)
        .filter(n => n !== null);
      const pMin = contractPrices.length ? Math.min(...contractPrices) : (l.price_monthly_min || 0);
      const pMax = contractPrices.length ? Math.max(...contractPrices) : (l.price_monthly_max || 0);
      if (priceMin > 0 && pMax > 0 && pMax < priceMin) return false;
      if (priceMax < Infinity && pMin > 0 && pMin > priceMax) return false;
    }

    return true;
  });

  filtered.sort((a,b) => {
    if (sort === "price_asc")
      return monthlyPrice(a) - monthlyPrice(b);
    if (sort === "price_desc")
      return monthlyPrice(b) - monthlyPrice(a);
    if (sort === "name")
      return (a.name || "").localeCompare(b.name || "");
    return new Date(b.source_updated_at || 0) -
           new Date(a.source_updated_at || 0);
  });

  document.getElementById("res-count").textContent =
    filtered.length.toLocaleString();

  renderPage();
  renderPager();
}

// Slider (échelle exponentielle : plus de précision sur les loyers bas)
const SLIDER_RES = 1000;
const SLIDER_MAX_PRICE = 60000;
const SLIDER_STEP = 500;

// Exposant choisi pour que le milieu du curseur (50%) corresponde à 10 000 ฿
const SLIDER_EXP = Math.log(SLIDER_MAX_PRICE / 10000) / Math.log(2);

function sliderPosToPrice(pos) {
  const raw = SLIDER_MAX_PRICE * Math.pow(pos / SLIDER_RES, SLIDER_EXP);
  return Math.round(raw / SLIDER_STEP) * SLIDER_STEP;
}

// En dessous de 100 ฿, aucun contrat réel n'existe à ce prix : on masque
// le filtre "Contrat" plutôt que de laisser des cases à cocher inutiles.
function updateContractSectionVisibility() {
  const rawMax = document.getElementById("f-max").value;
  const max = parseInt(rawMax);
  const hide = rawMax !== "" && !isNaN(max) && max < 100;
  document.getElementById("contract-filter-section").style.display = hide ? "none" : "";
  if (hide) {
    document.getElementById("f-monthly").checked = false;
    document.getElementById("f-3month").checked = false;
    document.getElementById("f-6month").checked = false;
  }
}

document.getElementById("f-slider").addEventListener("input", function() {
  const pos = parseInt(this.value);
  const price = sliderPosToPrice(pos);
  document.getElementById("slider-val").textContent = pos >= SLIDER_RES ? "Tous les prix" : `≤ ${price.toLocaleString("fr-FR")} ฿`;
  document.getElementById("f-max").value = pos < SLIDER_RES ? price : "";
  updateContractSectionVisibility();
  applyFilters();
});

function monthlyPrice(l) {
  // Le tri utilise uniquement le prix du contrat 1 mois. On délègue à
  // contractNum() pour la même logique de nettoyage (fourchettes, prix
  // aberrants < MIN_VALID_PRICE) que l'affichage des cartes.
  const n = contractNum(l.contract_monthly_raw);
  return n === null ? Infinity : n;
}

// Retourne le nombre brut (pour le calcul), ou null si absent/invalide.
// Certains prix sont une fourchette ("85 - 5,200 THB/month") où le bas est
// une aberration de scraping : en dessous de MIN_VALID_PRICE, on garde le
// haut de la fourchette ; si lui aussi est invalide, on abandonne le contrat.
const MIN_VALID_PRICE = 1000;
function contractNum(raw) {
  if (!raw || raw.trim() === "-" || raw.trim() === "") return null;
  const nums = (raw.match(/[\d,]+/g) || [])
    .map(s => parseInt(s.replace(/,/g, ""), 10))
    .filter(n => Number.isFinite(n) && n > 0);
  if (!nums.length) return null;

  const low = nums[0];
  const high = nums[nums.length - 1];
  if (low >= MIN_VALID_PRICE) return low;
  if (high >= MIN_VALID_PRICE) return high;
  return null;
}

function contractVal(raw) {
  const n = contractNum(raw);
  if (n === null) return "—";

  const eur = n / 38.28;

  const thb = n.toLocaleString("fr-FR");
  const euros = eur.toLocaleString("fr-FR", {
    maximumFractionDigits: 0
  });

  return `${thb} ฿<br>${euros} €`;
}

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// ── Pagination ────────────────────────────────────────────────────────

function renderPager() {
  const total = Math.ceil(filtered.length / PER_PAGE);
  const el = document.getElementById("pager");
  if (total <= 1) { el.innerHTML = ""; return; }

  const pages = [];
  for (let i = Math.max(1, page-2); i <= Math.min(total, page+2); i++) pages.push(i);
  if (pages[0] > 1) pages.unshift(1);
  if (pages[pages.length-1] < total) pages.push(total);

  let html = `<button aria-label="Page précédente" ${page===1?"disabled":""} onclick="goPage(${page-1})">‹</button>`;
  let prev = null;
  pages.forEach(p => {
    if (prev !== null && p - prev > 1) html += `<button disabled aria-hidden="true">…</button>`;
    html += `<button class="${p===page?"on":""}" aria-label="Page ${p}" aria-current="${p===page?"page":"false"}" onclick="goPage(${p})">${p}</button>`;
    prev = p;
  });
  html += `<button aria-label="Page suivante" ${page===total?"disabled":""} onclick="goPage(${page+1})">›</button>`;
  el.innerHTML = html;
}

function goPage(p) {
  page = p;
  renderPage();
  renderPager();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function trapModalFocus(e) {
  if (e.key !== "Tab") return;
  const overlay = document.getElementById("overlay");
  if (!overlay.classList.contains("open")) return;
  const focusable = document.getElementById("modal-body")
    .querySelectorAll('a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}

// Point GPS de l'adresse complète (rue/route + quartier) de l'annonce,
// si présent dans le cache chargé par loadAddressCoords(). Plus précis que
// districtPoint() quand RentHub publie un nom de rue.
function addressPoint(l) {
  if (!l.address) return null;
  return addressCoords[norm(l.address).toLowerCase()] || null;
}

// Point GPS pré-calculé du quartier (subdistrict/district/province) de
// l'annonce, si présent dans le cache chargé par loadDistrictCoords().
function districtPoint(l) {
  const k = [l.subdistrict, l.district, l.province].map(v => norm(v).toLowerCase()).join("|");
  return districtCoords[k] || null;
}

// Hash déterministe (FNV-1a) d'un id d'annonce en seed 32 bits, pour que
// le décalage aléatoire de jitterCoords() soit stable d'un rechargement à
// l'autre au lieu de faire "sauter" le point à chaque ouverture de la modal.
function hashSeed(id) {
  const str = String(id);
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// PRNG seedé (mulberry32) — déterministe pour un seed donné, sans dépendance externe.
function mulberry32(seed) {
  let t = seed >>> 0;
  return function() {
    t = (t + 0x6D2B79F5) | 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

// Décale un point GPS d'une distance aléatoire (mais stable, via `seedValue`)
// dans un rayon donné, façon Airbnb : brouille la position exacte du
// logement tout en gardant un point utile (même quartier/zone).
function jitterCoords(lat, lon, seedValue, radiusMeters = 250) {
  const rand = mulberry32(seedValue);
  const r = radiusMeters * Math.sqrt(rand());
  const theta = 2 * Math.PI * rand();
  const dLat = (r * Math.cos(theta)) / 111320;
  const dLon = (r * Math.sin(theta)) / (111320 * Math.cos(lat * Math.PI / 180));
  return { lat: lat + dLat, lon: lon + dLon };
}

// Le point GPS le plus précis disponible pour l'annonce, du plus précis
// au moins précis: ses propres coordonnées scrapées (décalées aléatoirement
// pour ne jamais exposer l'adresse exacte du logement — voir jitterCoords()),
// son adresse complète géocodée, puis le centre de son quartier. `precise`
// ne distingue plus que le cas adresse-avec-rue du simple centre de
// quartier : le point GPS propre n'est désormais plus jamais exact.
function mapPoint(l) {
  if (l.latitude != null && l.longitude != null) {
    const j = jitterCoords(l.latitude, l.longitude, hashSeed(l.id));
    return { lat: j.lat, lon: j.lon, precise: false };
  }
  const ap = addressPoint(l);
  if (ap) return { ...ap, precise: /\d/.test(l.address || "") };
  const dp = districtPoint(l);
  if (dp) return { ...dp, precise: false };
  return null;
}

function mapQuery(l) {
  const pt = mapPoint(l);
  if (pt) return `${pt.lat},${pt.lon}`;
  const q = l.address || [l.subdistrict, l.district, l.province].filter(Boolean).join(", ");
  return q ? `${q}, Thailand` : null;
}

function googleMapsUrl(l) {
  const q = mapQuery(l);
  if (!q) return null;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}

// Embed public sans clé API (endpoint historique `output=embed`) — pas
// aussi précis/officiel que l'API Maps Embed payante, mais suffisant
// pour situer un point sur une carte interactive intégrée à la modal.
function googleMapsEmbedUrl(l) {
  const q = mapQuery(l);
  if (!q) return null;
  const pt = mapPoint(l);
  const zoom = pt && pt.precise ? 17 : (pt ? 15 : 13);
  return `https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=${zoom}&output=embed`;
}

const humanizeRoomType = s => s ? s.toLowerCase().replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : null;

function roomTypeLabel(rt) {
  const roomType = humanizeRoomType(rt.room_type);
  return [
    rt.name && rt.name !== "Unknown" ? rt.name : null,
    roomType && roomType !== rt.name ? roomType : null,
    rt.size_sqm ? `${rt.size_sqm} m²` : null,
  ].filter(Boolean).join(" · ");
}

function contractRooms(l) {
  const rooms = (l.room_types || []).filter(rt =>
    rt.monthly_min_thb != null || rt.monthly_max_thb != null ||
    rt.contract_1_month_thb != null || rt.contract_3_month_thb != null || rt.contract_6_month_thb != null);
  const available = rooms.filter(rt => !rt.status || rt.status.trim().toLowerCase() === "available");
  return available.length ? available : rooms;
}

function contractsSectionTitle(l) {
  const useRooms = contractRooms(l);
  if (useRooms.length === 1) {
    const label = roomTypeLabel(useRooms[0]);
    if (label) return label;
  }
  return "Room Type";
}

function renderContractsHTML(l) {
  const fmt = n => n == null ? null : `${n.toLocaleString("en-US")} THB/month`;
  const useRooms = contractRooms(l);

  if (useRooms.length) {
    return useRooms.map(rt => {
      const label = roomTypeLabel(rt);
      const terms = [
        ["1 mois", fmt(rt.contract_1_month_thb)],
        ["3 mois", fmt(rt.contract_3_month_thb)],
        ["6 mois", fmt(rt.contract_6_month_thb)],
      ].filter(([, v]) => v != null);
      if (!terms.length) return "";
      const termsHTML = terms.map(([term, v]) => `
        <div class="mc">
          <div class="mc-label">${term}</div>
          <div class="mc-val">${esc(v)}</div>
        </div>`).join("");
      if (useRooms.length <= 1) return termsHTML;
      return `
        <div class="mc-room-group">
          ${label ? `<div class="mc-room-label">${esc(label)}</div>` : ""}
          <div class="mc-room-terms">${termsHTML}</div>
        </div>`;
    }).join("");
  }

  const contracts = [["1 mois", l.contract_monthly_raw], ["3 mois", l.contract_3_month_raw], ["6 mois", l.contract_6_month_raw]]
    .filter(([, raw]) => raw && raw !== "-");
  if (!contracts.length) return `<div class="mc"><div class="mc-val na">Aucun contrat disponible</div></div>`;
  return contracts.map(([label, raw]) => `
        <div class="mc">
          <div class="mc-label">${label}</div>
          <div class="mc-val">${esc(raw)}</div>
        </div>`).join("");
}

function modalHTML(l) {
  const locs = [l.subdistrict, l.district, l.province].filter(Boolean);
  const amenities = l.amenities || [];
  const mapsUrl = googleMapsUrl(l);
  const embedUrl = googleMapsEmbedUrl(l);
  const pt = mapPoint(l);
  const precisionLabel = !pt ? ""
    : "🔵 Position approximative (le logement est situé dans un rayon d'environ 250 m)";

  return `
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()" aria-label="Fermer">✕</button>
    </div>
    ${l.images && l.images.length ? `
    <div class="modal-gallery">
      ${l.images.map(u => `<div class="modal-gallery-item"><img src="${esc(u)}" alt="" loading="lazy" draggable="false" oncontextmenu="return false" onerror="this.parentElement.style.display='none'">${watermarkHTML()}</div>`).join("")}
    </div>` : ""}
    <div class="modal-tags">
      ${locs.map(loc => `<span class="tag">${esc(loc)}</span>`).join("")}
      ${l.has_monthly_contract === "true" && contractVal(l.contract_monthly_raw) !== "—" ? `<span class="badge badge-monthly" style="position:static;display:inline-block">1 MOIS</span>` : ""}
      ${contractVal(l.contract_3_month_raw) !== "—" ? `<span class="badge badge-term-3" style="position:static;display:inline-block">3 MOIS</span>` : ""}
      ${contractVal(l.contract_6_month_raw) !== "—" ? `<span class="badge badge-term-6" style="position:static;display:inline-block">6 MOIS</span>` : ""}
    </div>
    ${mapsUrl ? `
    <div>
      ${embedUrl ? `<iframe src="${esc(embedUrl)}" style="width:100%;height:220px;border:0;border-radius:8px" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Carte de localisation"></iframe>` : ""}
      ${precisionLabel ? `<div style="font-size:10px;color:var(--muted);margin-top:6px">${precisionLabel}</div>` : ""}
    </div>` : ""}
    <a class="listing-cta" href="/payant.html?listing=${encodeURIComponent(l.id)}" onclick="event.stopPropagation()">Voir l'annonce complète</a>
    <div>
      <div class="section-head">${esc(contractsSectionTitle(l))}</div>
      <div class="modal-contracts">
        ${renderContractsHTML(l)}
      </div>
    </div>
    ${l.deposit || (l.electric_price && l.electric_price !== "Please contact") || amenities.length ? `
    <div>
      <div class="section-head">Description</div>
      <div class="modal-contracts">
        <div class="mc"><div class="mc-label">Deposit</div><div class="mc-val${l.deposit ? "" : " na"}">${l.deposit ? esc(l.deposit) : "Non communiqué"}</div></div>
        ${l.electric_price && l.electric_price !== "Please contact" ? `<div class="mc"><div class="mc-label">Electric price</div><div class="mc-val">${esc(l.electric_price)}</div></div>` : ""}
        <div class="mc"><div class="mc-label">Air Conditioner</div><div class="mc-val${amenities.includes("Air Conditioner") ? "" : " na"}">${amenities.includes("Air Conditioner") ? "YES" : "NO"}</div></div>
      </div>
    </div>` : ""}
    ${amenities.length ? `
    <div>
      <div class="section-head">Équipements</div>
      <div class="modal-amenities">${amenities.map(a=>`<span class="amenity">${esc(AMENITY_ICONS[a] || a)}</span>`).join("")}</div>
    </div>` : ""}
  `;
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("overlay")) return;
  document.getElementById("overlay").classList.remove("open");
  if (lastFocusedEl) { lastFocusedEl.focus(); lastFocusedEl = null; }
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

function showLoading() {
  document.getElementById("grid-wrap").innerHTML = `<div class="state-box"><div class="spinner"></div>Chargement…</div>`;
}

init();
</script>
</body>
</html>
