<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiMonth Tracker</title>
<meta property="og:title" content="ThaiMonth Tracker">
<meta property="og:description" content="Suivi des annonces de location en Thaïlande">
<meta property="og:image" content="/static/logo.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #faf8f4;
    --surface:  #ffffff;
    --card:     #ffffff;
    --border:   #e9e4da;
    --accent:   #5046f5;
    --accent-ink: #ffffff;
    --brand-lime: #c7ef6c;
    --brand-gold: #e8b765;
    --blue:     #5046f5;
    --green:    #2f9e44;
    --red:      #e03131;
    --purple:   #7950f2;
    --text:     #14130f;
    --muted:    #6c6660;
    --dim:      #9b948b;
    --focus:    #5046f5;
    --mono:     'Plus Jakarta Sans', system-ui, sans-serif;
    --sans:     'Plus Jakarta Sans', system-ui, sans-serif;
    --r-pill:   9999px;
    --r-card:   20px;
    --r-ctl:    12px;
    --sky-1:    #cfe8b8;
    --sky-2:    #dcd6f9;
    --sky-3:    #cde8f4;
  }

  body {
    background: var(--sky-2);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
  }

  /* Ciel : un seul degrade fixe derriere la page (::after) et une bande de
     135px par-dessus le contenu (::before) qui masque ce qui passe sous le
     header. Les deux partagent la meme taille pour se superposer pile. */
  body::before, body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    pointer-events: none;
    background: linear-gradient(165deg,
      var(--sky-1) 0%, var(--sky-2) 46%, var(--sky-3) 100%) no-repeat;
    background-size: 100vw 100vh;
  }
  body::after { bottom: 0; z-index: -1; }
  body::before { height: 135px; z-index: 80; }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 8px;
    z-index: 100;
    width: calc(100% - 40px);
    max-width: 780px;
    margin: 8px auto 0;
    padding: 9px 10px 9px 22px;
    background: #1d3c10;
    border-radius: var(--r-pill);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    box-shadow: 0 10px 28px rgba(29,60,16,.22);
  }

  .logo {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    text-decoration: none;
    font-family: var(--sans);
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -.6px;
    line-height: 1;
  }
  .logo-thai { color: var(--brand-lime); }
  .logo-month { color: var(--brand-gold); }

  .header-map {
    background: var(--accent);
    color: #fff;
    border-radius: var(--r-pill);
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: filter .15s;
  }
  .header-map:hover { filter: brightness(1.12); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .hstat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 92px;
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,.7);
    border-radius: var(--r-pill);
    background: rgba(255,255,255,.82);
    font-family: var(--sans);
    font-size: 10px;
    line-height: 1.15;
    text-align: center;
    color: var(--muted);
  }
  .hstat b {
    color: var(--text);
    font-size: 13px;
    font-weight: 800;
    line-height: 1.2;
  }

  .city-stats {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    flex-shrink: 0;
    margin-left: auto;
  }

  .city-total {
    flex-shrink: 0;
  }

  /* ── Barre de villes ── */
  .city-bar {
    position: sticky;
    top: 76px;
    margin: 10px 28px 0;
    z-index: 90;
    padding: 14px 18px;
    border: 1px solid rgba(255,255,255,.78);
    border-radius: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 26px rgba(50,45,90,.08);
  }
  .city-bar::-webkit-scrollbar { display: none; }


  .location-filters { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .location-filter { display:flex; align-items:center; gap:8px; }
  .city-select {
    min-width:240px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--r-pill); color:var(--text); font-family:var(--sans);
    font-size:13px; padding:9px 12px; outline:none; cursor:pointer;
  }
  .city-select:focus { border-color:var(--accent); }
  .city-select:disabled { opacity:.5; cursor:not-allowed; }

  .city-label {
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: .05em;
    color: var(--dim);
    white-space: nowrap;
    margin-right: 4px;
    flex-shrink: 0;
  }

  .btn-new24h {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 9px 14px; border-radius: var(--r-pill);
    border: 1px solid var(--border); background: var(--card);
    color: var(--muted); font-family: var(--sans);
    font-size: 13px; font-weight: 500; cursor: pointer;
    white-space: nowrap; flex-shrink: 0; transition: all .15s;
  }
  .btn-new24h:hover { border-color: var(--purple); color: var(--text); }
  .btn-new24h.active { background: var(--purple); border-color: var(--purple); color: #fff; font-weight: 700; }
  .btn-new24h .new24h-count { font-family: var(--mono); font-size: 10px; opacity: .75; }


  /* ── Layout ── */
  .shell {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: calc(100vh - 101px);
    padding-top: 18px;
  }

  /* ── Sidebar ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    position: sticky;
    /* 76px (haut de la barre) + sa hauteur + 10px de marge */
    top: calc(86px + var(--city-bar-h, 74px));
    max-height: calc(100vh - 86px - var(--city-bar-h, 74px));
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .filter-section { display: flex; flex-direction: column; gap: 9px; }

  .filter-label {
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .filter-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    outline: none;
    transition: border-color .15s;
  }
  .filter-input:focus { border-color: var(--accent); }

  .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .slider-wrap { display: flex; flex-direction: column; gap: 6px; }
  .slider-wrap input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: var(--border);
    accent-color: var(--accent);
    cursor: pointer;
  }
  .slider-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    cursor: pointer;
  }
  .slider-wrap input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    cursor: pointer;
  }
  .slider-info {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }
  .slider-info #slider-val { color: var(--accent); font-weight: 700; }

  /* ── Filtres : chips ── */
  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip { position: relative; display: inline-flex; cursor: pointer; }
  .chip input { position: absolute; opacity: 0; width: 0; height: 0; }

  .chip-label {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--r-pill);
    background: var(--card);
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    user-select: none;
    transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .1s;
  }
  .chip:hover .chip-label { border-color: var(--accent); color: var(--text); }
  .chip:active .chip-label { transform: scale(.97); }
  .chip input:checked + .chip-label {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 3px 10px rgba(80,70,245,.28);
  }
  .chip input:focus-visible + .chip-label { outline: 2px solid var(--focus); outline-offset: 2px; }

  .chip-monthly input:checked + .chip-label { background: var(--green); border-color: var(--green); box-shadow: 0 3px 10px rgba(47,158,68,.28); }
  .chip-3month input:checked + .chip-label { background: var(--blue); border-color: var(--blue); box-shadow: 0 3px 10px rgba(80,70,245,.28); }
  .chip-6month input:checked + .chip-label { background: var(--purple); border-color: var(--purple); box-shadow: 0 3px 10px rgba(121,80,242,.28); }

  #contract-filter-section .chip-group .chip { flex: 1 1 0; }
  #contract-filter-section .chip-label { width: 100%; justify-content: center; }

  .chip-equip { row-gap: 8px; }
  .chip-equip .chip { flex: 1 1 calc(50% - 4px); }
  .chip-equip .chip-label { width: 100%; justify-content: flex-start; }

  .btn-reset {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: var(--r-pill);
    color: var(--muted);
    font-size: 12.5px;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: all .15s;
    margin-top: 4px;
  }
  .btn-reset:hover { border-color: var(--red); color: var(--red); background: rgba(224,49,49,.06); }

  /* ── Main ── */
  .main {
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .result-info {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .result-info b { color: var(--accent); font-size: 14px; }

  .sort-select {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    cursor: pointer;
  }

  /* ── Grille ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    overflow: hidden;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(20,19,15,.10);
  }

  .card-img {
    height: 150px;
    background: var(--border);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .card-img img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    -webkit-user-drag: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .card-img .no-img {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: var(--muted);
  }

  /* Filigrane texte "ThaiMonth" (memes couleurs que le logo de l'en-tete):
     motif repete sur toute la photo + pastille pleine en bas a droite. */
  .wm-tile{
    position:absolute;inset:-40%;display:flex;flex-wrap:wrap;gap:6px 10px;
    align-content:space-around;justify-content:space-around;
    transform:rotate(-18deg);pointer-events:none;user-select:none;opacity:.9
  }
  .wm-tile span{
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.4px;
    white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.35)
  }
  .wm-thai{ color:var(--brand-lime) }
  .wm-month{ color:var(--brand-gold) }
  .wm-badge{
    position:absolute;right:10px;bottom:10px;pointer-events:none;user-select:none;
    background:#1d3c10;border-radius:var(--r-pill);padding:6px 13px;
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.4px;
    line-height:1;box-shadow:0 3px 10px rgba(20,19,15,.35)
  }
  .modal-gallery-item .wm-tile span{ font-size:17px }
  .modal-gallery-item .wm-badge{ font-size:18px;padding:8px 16px;right:12px;bottom:12px }

  .modal-gallery {
    display: flex;
    flex-shrink: 0;
    height: 220px;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    margin: 0 -18px 4px;
    padding: 0 18px;
  }
  .modal-gallery-item {
    position: relative;
    flex-shrink: 0;
    height: 220px;
    max-width: 85%;
    scroll-snap-align: start;
    overflow: hidden;
    border-radius: 8px;
  }
  .modal-gallery-item img {
    height: 220px;
    width: auto;
    max-width: 100%;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
    transform: scaleX(-1);
    -webkit-user-drag: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    pointer-events: none;
    cursor: default;
  }

  .badge {
    position: absolute;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    letter-spacing: .05em;
  }
  .badge-monthly { top: 8px; left: 8px; background: var(--green); color: #fff; }
  .badge-verified { top: 8px; right: 8px; background: var(--blue); color: #fff; }
  .badge-term-3 { background: var(--blue); color: #fff; }
  .badge-term-6 { background: var(--purple); color: #fff; }

  .card-badge-slot { padding: 8px 14px 0; height: 25px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; }

  .card-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }

  .card-name {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-loc {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .loc-district {
    background: rgba(80,70,245,.10);
    color: var(--blue);
    border-radius: var(--r-pill);
    padding: 2px 9px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
  }
  .loc-province {
    font-size: 11px;
    color: var(--muted);
  }

  .card-contracts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-top: auto;
  }
  .cc {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-ctl);
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    text-align: center;
    min-width: 0;
  }
  .cc-label {
    font-size: 9px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    margin-bottom: 0;
  }
  .cc-val {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.3;
    overflow-wrap: break-word;
    max-width: 100%;
  }
  .cc-val.na { color: var(--muted); font-weight: 400; font-size: 11px; }

  .card-date {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--muted);
  }

  /* ── States ── */
  .state-box {
    display: flex; align-items: center; justify-content: center;
    height: 220px; color: var(--muted);
    font-family: var(--mono); font-size: 13px; gap: 10px;
    flex-direction: column;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Pagination ── */
  .pager {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 8px 0;
  }
  .pager button {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 5px 11px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .pager button:hover:not(:disabled) { border-color: var(--accent); }
  .pager button.on { border-color: var(--accent); color: var(--accent); }
  .pager button:disabled { opacity: .3; cursor: default; }

  /* ── Modal ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,19,15,.45);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    width: 100%; max-width: 600px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 18px;
  }

  .modal-top {
    display: flex; justify-content: flex-end; align-items: flex-start; gap: 12px;
  }
  .modal-close {
    background: none; border: 1px solid var(--border);
    border-radius: var(--r-pill); color: var(--muted);
    width: 28px; height: 28px; cursor: pointer;
    font-size: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 3px 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .tag.green { border-color: var(--green); color: var(--green); }

  .modal-contracts {
    display: grid; grid-template-columns: 1fr; gap: 8px;
  }
  .mc {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--r-ctl); padding: 13px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .mc-label {
    font-size: 9px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 0;
  }
  .mc-val {
    font-size: 13px; font-weight: 700;
    font-family: var(--mono); color: var(--accent);
  }
  .mc-val.na { color: var(--muted); font-weight: 400; font-size: 12px; }
  .mc-room-label {
    font-size: 10px; font-family: var(--mono); font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text); margin: 10px 0 -2px;
  }
  .mc-room-label:first-child { margin-top: 0; }
  .mc-room-group {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }

    background: var(--bg); border: 1px solid var(--border);

.card-categories {

}

.amenity-badge {

.listing-cta:hover { opacity: .85; }

  @media (max-width: 1200px) {

<script>
// La barre de villes passe sur deux lignes sous ~1550px : on publie sa
// hauteur reelle pour que la sidebar sticky se cale juste en dessous.
(() => {
  const bar = document.querySelector(".city-bar");
  if (!bar || !("ResizeObserver" in window)) return;
  new ResizeObserver(() => {
    document.documentElement.style.setProperty("--city-bar-h", `${bar.offsetHeight}px`);
  }).observe(bar);
})();

// ── Init ────────────────────────────────────────────────────────────

async function init() {
  await Promise.all([loadStats(), loadListings(), loadDistrictCoords(), loadAddressCoords()]);
}

Object.entries(REGION_MAP).forEach(([city, region]) => { REGION_BY_KEY[key(city)] = region; });

document.addEventListener("click", (e) => {
  const wrap = document.getElementById("region-fab-wrap");
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById("region-menu").classList.remove("open");
    document.getElementById("region-fab").setAttribute("aria-expanded", "false");
  }
});

document.getElementById("f-slider").addEventListener("input", function() {
  const pos = parseInt(this.value);
  const price = sliderPosToPrice(pos);
  document.getElementById("slider-val").textContent = pos >= SLIDER_RES ? "Tous les prix" : `≤ ${price.toLocaleString("fr-FR")} ฿`;
  document.getElementById("f-max").value = pos < SLIDER_RES ? price : "";
  updateContractSectionVisibility();
  applyFilters();
});

["f-min","f-max"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    if (id === "f-max") updateContractSectionVisibility();
    clearTimeout(_t); _t = setTimeout(applyFilters, 280);
  });
});

// ── Rendu ────────────────────────────────────────────────────────────

function cardHTML(l) {
  const district = l.district || l.subdistrict || "";
  const c1 = contractVal(l.contract_monthly_raw);
  const c3 = contractVal(l.contract_3_month_raw);
  const c6 = contractVal(l.contract_6_month_raw);
  const updated = l.source_updated_at ? new Date(l.source_updated_at).toLocaleDateString("fr-FR") : "";

  // Quand un toggle "X mois uniquement" est actif, on n'affiche que le
  // prix de la catégorie sélectionnée (pas les autres durées disponibles).
  const monthlyOnly = document.getElementById("f-monthly").checked;
  const threeMonthOnly = document.getElementById("f-3month").checked;
  const sixMonthOnly = document.getElementById("f-6month").checked;
  const anyContractOnly = monthlyOnly || threeMonthOnly || sixMonthOnly;
  const show1 = !anyContractOnly || monthlyOnly;
  const show3 = !anyContractOnly || threeMonthOnly;
  const show6 = !anyContractOnly || sixMonthOnly;

  // Catégories dérivées côté serveur depuis la description (fiable, par
  // annonce) — voir src/normalizers/amenities.py. On ne re-devine rien
  // côté client.
  const amenities = l.amenities || [];
  const categoryIcons = {
    "Desk": AMENITY_ICONS["Desk"],
    "In-room WIFI": AMENITY_ICONS["In-room WIFI"],
    "Smoking": AMENITY_ICONS["Smoking"],
    "Pool": AMENITY_ICONS["Pool"],
    "Fitness": AMENITY_ICONS["Fitness"],
    "Convenient Store": AMENITY_ICONS["Convenient Store"],
  };
  const categories = Object.keys(categoryIcons)
    .filter(k => amenities.includes(k))
    .map(k => categoryIcons[k]);

  return `<div class="card" tabindex="0" role="button" aria-label="Voir le détail : ${esc(l.name || "annonce")}" onclick="openModal(${l.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openModal(${l.id});}">
    <div class="card-img">${l.images && l.images.length
      ? `<img src="${esc(l.images[0])}" alt="" loading="lazy" draggable="false" oncontextmenu="return false" onerror="this.parentElement.innerHTML='<div class=&quot;no-img&quot;>🏠</div>'">${watermarkHTML()}`
      : `<div class="no-img">🏠</div>`}</div>
    <div class="card-badge-slot">${show1 && l.has_monthly_contract === "true" && c1 !== "—" ? `<span class="badge badge-monthly" style="position:static;display:inline-block">1 MOIS</span>` : ""}${show3 && c3 !== "—" ? `<span class="badge badge-term-3" style="position:static;display:inline-block">3 MOIS</span>` : ""}${show6 && c6 !== "—" ? `<span class="badge badge-term-6" style="position:static;display:inline-block">6 MOIS</span>` : ""}</div>

    <div class="card-body">

      <div class="card-loc">
        ${district ? `<span class="loc-district">${esc(district)}</span>` : ""}
        ${l.province ? `<span class="loc-province">${esc(l.province)}</span>` : ""}
      </div>

      ${categories.length ? `
        <div class="card-categories">
          ${categories.map(c => `<span class="amenity-badge">${esc(c)}</span>`).join("")}
        </div>
      ` : ""}

      <a class="listing-cta" href="/payant.html?listing=${encodeURIComponent(l.id)}" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()">Voir l'annonce complète</a>

      ${(() => {
        const boxes = [
          show1 && c1 !== "—" ? `<div class="cc"><div class="cc-label">1 mois</div><div class="cc-val">${c1}</div></div>` : "",
          show3 && c3 !== "—" ? `<div class="cc"><div class="cc-label">3 mois</div><div class="cc-val">${c3}</div></div>` : "",
          show6 && c6 !== "—" ? `<div class="cc"><div class="cc-label">6 mois</div><div class="cc-val">${c6}</div></div>` : "",
        ].filter(Boolean);
        return boxes.length
          ? `<div class="card-contracts">${boxes.join("")}</div>`
          : "";
      })()}

      ${updated ? `<div class="card-date">Mis à jour: ${updated}</div>` : ""}

    </div>
  </div>`;
}

// ── Pagination ────────────────────────────────────────────────────────

// ── Modal ────────────────────────────────────────────────────────────

async function openModal(id) {
  lastFocusedEl = document.activeElement;
  document.getElementById("overlay").classList.add("open");
  const body = document.getElementById("modal-body");
  body.innerHTML = `<div class="state-box"><div class="spinner"></div></div>`;
  body.focus();
  try {
    const l = await fetch(`${API}/listings/${id}`).then(r => r.json());
    body.innerHTML = modalHTML(l);
  } catch(e) {
    body.innerHTML = `<div class="state-box">Erreur de chargement</div>`;
  }
}

const modalBody = document.getElementById("modal-body");
["contextmenu", "dragstart", "selectstart", "copy"].forEach(eventName => {
  modalBody.addEventListener(eventName, event => {
    if (event.target.closest(".modal-gallery")) event.preventDefault();
  });
});

document.addEventListener("keydown", trapModalFocus);

// Le point GPS le plus précis disponible pour l'annonce, du plus précis
// au moins précis: ses propres coordonnées (déjà approximatives côté API
// pour un visiteur non premium, voir main.py::_approximate_position — un
// second flou côté client cassait la garantie du cercle de 350 m), son
// adresse complète géocodée, puis le centre de son quartier.
function mapPoint(l) {
  if (l.latitude != null && l.longitude != null) {
    return { lat: l.latitude, lon: l.longitude, precise: !l.location_approx };
  }
  const ap = addressPoint(l);
  if (ap) return { ...ap, precise: /\d/.test(l.address || "") };
  const dp = districtPoint(l);
  if (dp) return { ...dp, precise: false };
  return null;
}

function modalHTML(l) {
  const locs = [l.subdistrict, l.district, l.province].filter(Boolean);
  const amenities = l.amenities || [];
  const mapsUrl = googleMapsUrl(l);
  const embedUrl = googleMapsEmbedUrl(l);
  const pt = mapPoint(l);
  const precisionLabel = !pt ? ""
    : "🔵 Position approximative (le logement est situé dans un rayon d'environ 250 m)";

  return `
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()" aria-label="Fermer">✕</button>
    </div>
    ${l.images && l.images.length ? `
    <div class="modal-gallery">
      ${l.images.map(u => `<div class="modal-gallery-item"><img src="${esc(u)}" alt="" loading="lazy" draggable="false" oncontextmenu="return false" onerror="this.parentElement.style.display='none'">${watermarkHTML()}</div>`).join("")}
    </div>` : ""}
    <div class="modal-tags">
      ${locs.map(loc => `<span class="tag">${esc(loc)}</span>`).join("")}
      ${l.has_monthly_contract === "true" && contractVal(l.contract_monthly_raw) !== "—" ? `<span class="badge badge-monthly" style="position:static;display:inline-block">1 MOIS</span>` : ""}
      ${contractVal(l.contract_3_month_raw) !== "—" ? `<span class="badge badge-term-3" style="position:static;display:inline-block">3 MOIS</span>` : ""}
      ${contractVal(l.contract_6_month_raw) !== "—" ? `<span class="badge badge-term-6" style="position:static;display:inline-block">6 MOIS</span>` : ""}
    </div>
    ${mapsUrl ? `
    <div>
      ${embedUrl ? `<iframe src="${esc(embedUrl)}" style="width:100%;height:220px;border:0;border-radius:8px" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Carte de localisation"></iframe>` : ""}
      ${precisionLabel ? `<div style="font-size:10px;color:var(--muted);margin-top:6px">${precisionLabel}</div>` : ""}
    </div>` : ""}
    <a class="listing-cta" href="/payant.html?listing=${encodeURIComponent(l.id)}" onclick="event.stopPropagation()">Voir l'annonce complète</a>
    <div>
      <div class="section-head">${esc(contractsSectionTitle(l))}</div>
      <div class="modal-contracts">
        ${renderContractsHTML(l)}
      </div>
    </div>
    ${l.deposit || (l.electric_price && l.electric_price !== "Please contact") || amenities.length ? `
    <div>
      <div class="section-head">Description</div>
      <div class="modal-contracts">
        <div class="mc"><div class="mc-label">Deposit</div><div class="mc-val${l.deposit ? "" : " na"}">${l.deposit ? esc(l.deposit) : "Non communiqué"}</div></div>
        ${l.electric_price && l.electric_price !== "Please contact" ? `<div class="mc"><div class="mc-label">Electric price</div><div class="mc-val">${esc(l.electric_price)}</div></div>` : ""}
        <div class="mc"><div class="mc-label">Air Conditioner</div><div class="mc-val${amenities.includes("Air Conditioner") ? "" : " na"}">${amenities.includes("Air Conditioner") ? "YES" : "NO"}</div></div>
      </div>
    </div>` : ""}
    ${amenities.length ? `
    <div>
      <div class="section-head">Équipements</div>
      <div class="modal-amenities">${amenities.map(a=>`<span class="amenity">${esc(AMENITY_ICONS[a] || a)}</span>`).join("")}</div>
    </div>` : ""}
  `;
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
});

init();
</script>
