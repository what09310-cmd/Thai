<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiMonth — Carte Thaïlande</title>
<meta property="og:title" content="ThaiMonth — Carte Thaïlande">
<meta property="og:description" content="Toutes les annonces actives géolocalisées en Thaïlande">
<meta property="og:image" content="/static/logo.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #faf8f4;
    --surface:  #ffffff;
    --card:     #ffffff;
    --border:   #e9e4da;
    --accent:   #5046f5;
    --accent-ink: #ffffff;
    --brand-lime: #c7ef6c;
    --brand-gold: #e8b765;
    --green:    #2f9e44;
    --blue:     #5046f5;
    --purple:   #7950f2;
    --text:     #14130f;
    --muted:    #6c6660;
    --dim:      #9b948b;
    --focus:    #5046f5;
    --mono:     'Plus Jakarta Sans', system-ui, sans-serif;
    --sans:     'Plus Jakarta Sans', system-ui, sans-serif;
    --r-pill:   9999px;
    --r-card:   20px;
    --r-ctl:    12px;
    --sky-1:    #cfe8b8;
    --sky-2:    #dcd6f9;
    --sky-3:    #cde8f4;
  }

  html,body{height:100%}
  body{ font-family:var(--sans);background:var(--bg);color:var(--text) }

  header{
    position:absolute;top:14px;left:14px;right:14px;
    width:auto;max-width:780px;margin:0 auto;
    padding:9px 10px 9px 22px;background:#1d3c10;border-radius:var(--r-pill);
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    box-shadow:0 10px 28px rgba(29,60,16,.28);z-index:2000
  }
  .logo{
    display:flex;align-items:center;text-decoration:none;
    font-family:var(--sans);font-size:25px;font-weight:800;
    letter-spacing:-.6px;line-height:1;flex-shrink:0
  }
  .logo-thai{ color:var(--brand-lime) }
  .logo-month{ color:var(--brand-gold) }
  .header-list{
    background:var(--accent);color:#fff;
    border-radius:var(--r-pill);padding:10px 20px;font-size:14px;font-weight:600;
    text-decoration:none;white-space:nowrap;transition:filter .15s;flex-shrink:0
  }
  .header-list:hover{ filter:brightness(1.12) }

  main{ height:100vh }

  #map{ position:relative;height:100%;background:var(--bg) }
  #leaflet-map{ width:100%; height:100% }
  .leaflet-tile-pane{ filter:saturate(.85) brightness(1.02) contrast(.96); }
  .leaflet-control-zoom a{ background:var(--card) !important;color:var(--text) !important;border-color:var(--border) !important }
  .leaflet-control-zoom a:hover{ background:var(--bg) !important }
  .leaflet-control-attribution{ background:rgba(255,255,255,.85) !important;color:var(--muted) !important }
  .leaflet-control-attribution a{ color:var(--accent) !important }

  .pin-icon{
    width:14px;height:14px;border-radius:50%;
    background:var(--accent);border:2px solid #fff;
    box-shadow:0 2px 6px rgba(20,19,15,.35);
  }

  .leaflet-popup-content{ font-family:var(--sans);font-size:13px;margin:10px 12px }
  .leaflet-popup-content-wrapper{ background:var(--card);color:var(--text);border-radius:var(--r-ctl);box-shadow:0 10px 30px rgba(20,19,15,.18) }
  .leaflet-popup-tip{ background:var(--card) }

  /* Popup "fiche": la carte occupe toute la bulle, la photo vient a fond
     perdu, d'ou la marge nulle et l'overflow masque. */
  .popup-lg .leaflet-popup-content-wrapper{ padding:0;overflow:hidden;border-radius:var(--r-card) }
  .popup-lg .leaflet-popup-content{ margin:0;width:390px !important;line-height:1.45 }
  .popup-lg .leaflet-popup-close-button{
    color:#fff !important;background:rgba(20,19,15,.45);backdrop-filter:blur(4px);
    border-radius:50%;width:26px !important;height:26px !important;
    line-height:24px !important;top:10px !important;right:10px !important;
    font-size:16px !important;z-index:5;transition:background .15s
  }
  .popup-lg .leaflet-popup-close-button:hover{ background:rgba(20,19,15,.7) }

  .popup-card{ display:flex;flex-direction:column;max-height:82vh }

  /* Photos */
  .popup-photos-wrap{ position:relative }
  .popup-photos{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    background:var(--border);scrollbar-width:none
  }
  .popup-photos::-webkit-scrollbar{ display:none }
  .popup-photos.is-empty{ display:none }
  .popup-photo{ position:relative;flex:0 0 100%;height:200px;scroll-snap-align:center }
  .popup-photo img{
    height:200px;width:100%;object-fit:cover;display:block;background:var(--border);
    transform:scaleX(-1);cursor:default;pointer-events:none;
    -webkit-user-drag:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none
  }
  /* Filigrane texte "ThaiMonth" (memes couleurs que le logo de l'en-tete):
     motif repete sur toute la photo + pastille pleine en bas a droite. */
  .wm-tile{
    position:absolute;inset:-40%;display:flex;flex-wrap:wrap;gap:6px 10px;
    align-content:space-around;justify-content:space-around;
    transform:rotate(-18deg);pointer-events:none;user-select:none;opacity:.9
  }
  .wm-tile span{
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.4px;
    white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.35)
  }
  .wm-thai{ color:var(--brand-lime) }
  .wm-month{ color:var(--brand-gold) }
  .wm-badge{
    position:absolute;right:10px;bottom:10px;pointer-events:none;user-select:none;
    background:#1d3c10;border-radius:var(--r-pill);padding:6px 13px;
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.4px;
    line-height:1;box-shadow:0 3px 10px rgba(20,19,15,.35)
  }
  .modal-gallery-item .wm-tile span{ font-size:17px }
  .modal-gallery-item .wm-badge{ font-size:18px;padding:8px 16px;right:12px;bottom:12px }
  .popup-photos-count{
    position:absolute;left:10px;bottom:10px;z-index:3;pointer-events:none;
    background:rgba(20,19,15,.6);backdrop-filter:blur(4px);color:#fff;
    border-radius:var(--r-pill);padding:3px 9px;
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em
  }
  .popup-photos-skel{
    height:200px;width:100%;flex:0 0 100%;
    background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%);
    background-size:200% 100%;animation:popup-skel 1.2s linear infinite
  }
  @keyframes popup-skel{ from{background-position:200% 0} to{background-position:-200% 0} }

  /* Corps scrollable */
  .popup-body{ padding:14px 16px 4px;overflow-y:auto;display:flex;flex-direction:column;gap:12px }

  .popup-price{ display:flex;align-items:baseline;gap:7px;flex-wrap:wrap }
  .popup-price-thb{ font-weight:800;color:var(--text);font-size:22px;line-height:1.05;letter-spacing:-.5px }
  .popup-price-unit{ font-size:12px;font-weight:600;color:var(--muted) }
  .popup-price-eur{ font-size:11px;color:var(--dim);font-weight:600 }
  .popup-loc{ font-size:11.5px;color:var(--muted);margin-top:6px }

  .popup-badges{ display:flex;flex-wrap:wrap;gap:5px;margin-top:8px }
  .popup-badge{
    border-radius:var(--r-pill);padding:3px 9px;font-size:9.5px;font-weight:800;
    font-family:var(--mono);letter-spacing:.06em;color:#fff;white-space:nowrap
  }
  .popup-badge-1{ background:var(--accent) }
  .popup-badge-3{ background:var(--purple) }
  .popup-badge-6{ background:var(--brand-gold);color:var(--text) }

  /* Specs en lignes label/valeur: plus calme que des cartes empilees,
     et aligne sur le rendu de la modale. */
  .popup-specs{
    border:1px solid var(--border);border-radius:var(--r-ctl);
    background:var(--bg);overflow:hidden
  }
  .popup-spec{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    padding:8px 12px;border-bottom:1px solid var(--border)
  }
  .popup-spec:last-child{ border-bottom:none }
  .popup-spec-label{
    font-size:9.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;
    color:var(--dim);white-space:nowrap;flex-shrink:0
  }
  .popup-spec-val{ font-size:12px;font-weight:700;color:var(--text);text-align:right;word-break:break-word }
  .popup-spec-val.na{ color:var(--dim);font-weight:500 }
  .popup-spec-val.yes{ color:var(--green) }

  .popup-section-head{
    font-size:9.5px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);margin-bottom:6px
  }
  .popup-rooms{ display:grid;grid-template-columns:1fr;gap:6px }
  .popup-rooms .mc{ padding:8px 12px }
  .popup-rooms .mc-val{ font-size:12px }
  .popup-rooms .mc-room-group{ padding:9px;gap:6px }
  .popup-rooms .mc-room-label{ font-size:9.5px }
  .popup-rooms .mc-room-terms{ gap:6px }
  .popup-rooms .mc-room-terms .mc{ flex:1 1 80px;padding:7px 9px }

  .popup-amenities{ display:flex;flex-wrap:wrap;gap:5px }
  .popup-chip{
    background:var(--card);border:1px solid var(--border);border-radius:var(--r-pill);
    padding:3px 9px;font-size:10.5px;color:var(--muted);white-space:nowrap
  }
  .popup-chip-more{ background:var(--bg);color:var(--dim);font-weight:700 }

  /* Footer colle: le CTA reste visible meme si le corps defile. */
  .popup-actions{
    position:sticky;bottom:0;padding:12px 16px 14px;background:var(--card);
    border-top:1px solid var(--border);display:flex;gap:6px
  }
  /* `.leaflet-container a` (0,1,1) bat `.popup-btn` (0,1,0): sans ce
     selecteur le libelle prend le bleu de lien Leaflet sur fond violet. */
  .leaflet-container a.popup-btn{
    flex:1;text-align:center;background:var(--accent);color:var(--accent-ink);
    text-decoration:none;padding:11px 14px;border-radius:var(--r-pill);
    font-size:12.5px;font-weight:700;transition:filter .15s
  }
  .leaflet-container a.popup-btn:hover{ filter:brightness(1.12) }

  /* ── Modale (portee depuis index.html) ── */
  .modal-gallery-item .photo-watermark {
    position: absolute;
    right: 8px;
    bottom: 8px;
    transform: none;
    width: auto;
    height: 55px;
    opacity: 1;
    pointer-events: none;
    background: none;
  }

  .photo-watermark-tile {
    position: absolute;
    inset: 0;
    background-image: url('/static/logo.png');
    background-repeat: repeat;
    background-size: 70px auto;
    opacity: .45;
    pointer-events: none;
  }
  .modal-gallery-item .photo-watermark-tile {
    background-size: 90px auto;
  }

  .modal-gallery {
    display: flex;
    flex-shrink: 0;
    height: 220px;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    margin: 0 -18px 4px;
    padding: 0 18px;
  }
  .modal-gallery-item {
    position: relative;
    flex-shrink: 0;
    height: 220px;
    max-width: 85%;
    scroll-snap-align: start;
  }
  .modal-gallery-item img {
    height: 220px;
    width: auto;
    max-width: 100%;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
    transform: scaleX(-1);
    -webkit-user-drag: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: zoom-in;
  }
  .modal-gallery-item .photo-watermark {
    height: 85px;
    bottom: 12px;
    right: 12px;
  }

  .badge {
    position: absolute;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    letter-spacing: .05em;
  }
  .badge-monthly { top: 8px; left: 8px; background: var(--green); color: #fff; }
  .badge-verified { top: 8px; right: 8px; background: var(--blue); color: #fff; }
  .badge-term-3 { background: var(--blue); color: #fff; }
  .badge-term-6 { background: var(--purple); color: #fff; }

  .state-box {
    display: flex; align-items: center; justify-content: center;
    height: 220px; color: var(--muted);
    font-family: var(--mono); font-size: 13px; gap: 10px;
    flex-direction: column;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }


  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,19,15,.45);
    backdrop-filter: blur(8px);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .overlay.open { display: flex; }

  .lightbox-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 4000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-content {
    position: relative;
    max-width: 95vw;
    max-height: 95vh;
  }
  .lightbox-content img#lightbox-img {
    display: block;
    max-width: 95vw;
    max-height: 95vh;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: 8px;
    background: var(--border);
    transform: scaleX(-1);
    -webkit-user-drag: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: default;
  }
  .lightbox-close {
    position: fixed;
    top: 20px; right: 20px;
    background: rgba(0,0,0,.5);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #fff;
    width: 32px; height: 32px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .lightbox-close:hover { color: var(--accent); }
  .lightbox-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,.5);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #fff;
    width: 44px; height: 44px;
    cursor: pointer;
    font-size: 26px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .lightbox-nav:hover { color: var(--accent); }
  .lightbox-nav[disabled] { display: none; }
  .lightbox-prev { left: 20px; }
  .lightbox-next { right: 20px; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    width: 100%; max-width: 600px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 18px;
  }

  .modal-top {
    display: flex; justify-content: flex-end; align-items: flex-start; gap: 12px;
  }
  .modal-close {
    background: none; border: 1px solid var(--border);
    border-radius: var(--r-pill); color: var(--muted);
    width: 28px; height: 28px; cursor: pointer;
    font-size: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--r-pill);
    padding: 3px 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .tag.green { border-color: var(--green); color: var(--green); }

  .modal-contracts {
    display: grid; grid-template-columns: 1fr; gap: 8px;
  }
  .mc {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--r-ctl); padding: 13px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .mc-label {
    font-size: 9px; font-family: var(--mono);
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 0;
  }
  .mc-val {
    font-size: 13px; font-weight: 700;
    font-family: var(--mono); color: var(--accent);
  }
  .mc-val.na { color: var(--muted); font-weight: 400; font-size: 12px; }
  .mc-room-label {
    font-size: 10px; font-family: var(--mono); font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text); margin: 10px 0 -2px;
  }
  .mc-room-label:first-child { margin-top: 0; }
  .mc-room-group {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .mc-room-group .mc-room-label { margin: 0; }
  .mc-room-terms { display: flex; flex-wrap: wrap; gap: 8px; }
  .mc-room-terms .mc { flex: 1 1 90px; flex-direction: column; align-items: flex-start; gap: 2px; }

  .modal-amenities { display: flex; flex-wrap: wrap; gap: 5px; }
  .amenity {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--r-pill); padding: 4px 10px;
    font-size: 11px; color: var(--muted); font-family: var(--mono);
  }

  .section-head {
    font-size: 10px; font-family: var(--mono);
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }

  .modal-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 13px;
    padding: 11px 22px; border-radius: var(--r-pill);
    text-decoration: none; align-self: flex-start;
    transition: opacity .15s;
  }
  .modal-link:hover { opacity: .85; }
  a.mc-wa, a.mc-line {
    text-decoration: none; color: inherit; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  a.mc-wa:hover { background: #25D36615; border-color: #25D366; }
  a.mc-line:hover { background: #06C75515; border-color: #06C755; }


  .controls{
    position:absolute;top:14px;left:14px;z-index:1000;
    background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
    box-shadow:0 10px 30px rgba(20,19,15,.12);
    padding:18px;width:270px;display:flex;flex-direction:column;gap:18px
  }

  .filter-section{ display:flex;flex-direction:column;gap:9px }
  .filter-label{
    font-size:11px;font-family:var(--mono);letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim)
  }
  .chip-group{ display:flex;flex-wrap:wrap;gap:8px }
  .chip{
    padding:8px 13px;border-radius:var(--r-pill);border:1.5px solid var(--border);
    background:var(--card);color:var(--muted);font-family:var(--sans);
    font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s
  }
  .chip:hover{ border-color:var(--accent);color:var(--text) }
  .chip.active{
    background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;
    box-shadow:0 3px 10px rgba(80,70,245,.28)
  }

  .budget-values{
    display:flex;justify-content:space-between;font-size:12px;
    font-family:var(--mono);color:var(--text)
  }
  .budget-values #budget-min-label, .budget-values #budget-max-label{ color:var(--accent);font-weight:700 }
  .range-slider{ position:relative;height:28px;margin-top:2px }
  .range-slider .range-track{
    position:absolute;top:50%;left:0;right:0;height:6px;
    transform:translateY(-50%);background:var(--border);border-radius:999px
  }
  .range-slider .range-fill{
    position:absolute;top:50%;height:6px;
    transform:translateY(-50%);background:var(--accent);border-radius:999px
  }
  .range-slider input[type="range"]{
    position:absolute;top:0;left:0;width:100%;height:28px;margin:0;
    background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none
  }
  .range-slider input[type="range"]::-webkit-slider-runnable-track{
    -webkit-appearance:none;background:transparent
  }
  .range-slider input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;pointer-events:auto;
    width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:3px solid #fff;cursor:pointer;
    box-shadow:0 1px 4px rgba(20,19,15,.3);margin-top:5px
  }
  .range-slider input[type="range"]::-moz-range-track{ background:transparent;border:none }
  .range-slider input[type="range"]::-moz-range-thumb{
    pointer-events:auto;width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:3px solid #fff;cursor:pointer;

function hasRealWhatsapp(raw) {
  return !!raw && String(raw).replace(/\D/g, "").length >= 5;
}

// Affichage voulu: "(+66) 81 806 3131" — indicatif entre parenthèses, puis
// le numéro thaï découpé 2-3-4 chiffres (format international standard des
// mobiles thaïlandais). Les numéros hors format habituel (indicatif
// étranger, longueur atypique) sont juste regroupés par 3 en repli.
function formatWhatsapp(raw) {
  const digits = String(raw || "").replace(/\D/g, "");
  const cc = digits.slice(0, 2);
  const rest = digits.slice(2);
  const groups = rest.length === 9
    ? [rest.slice(0, 2), rest.slice(2, 5), rest.slice(5, 9)]
    : (rest.match(/.{1,3}/g) || []);
  return `(+${cc}) ${groups.join(" ")}`;
}
let selectedBudget = null;
let selectedDuration = "";
let onlyNew = false;
const selectedAmenities = new Set();
const markersById = {};

  "1 mois": "contract_monthly",

const EUR_TO_THB = 38.28;

function amenityChips(ad){
  const amenities = ad.amenities || [];

  return Object.keys(AMENITY_ICONS).filter(k => k !== "Air Conditioner" && amenities.includes(k));
}

const APPROX_RADIUS_M = 350;

function pinIcon(){
  return L.divIcon({ className: "", html: `<div class="pin-icon"></div>`, iconSize: [12, 12] });
}

const POPUP_MAX_CHIPS = 6;
const detailCache = {};

function popupSpec(label, value, cls){
  const has = value != null && value !== "" && value !== "-" && value !== "Please contact";
  return `<div class="popup-spec">` +
    `<span class="popup-spec-label">${escapeHtml(label)}</span>` +
    `<span class="popup-spec-val${has ? (cls ? " " + cls : "") : " na"}">${has ? escapeHtml(value) : "Non communiqu&eacute;"}</span>` +
    `</div>`;
}

const WM_TILE_COUNT = 120;
function watermarkHTML(){
  const logo = `<span class="wm-thai">Thai</span><span class="wm-month">Month</span>`;
  return `<div class="wm-tile">${Array.from({ length: WM_TILE_COUNT }, () => `<span>${logo}</span>`).join("")}</div>` +
    `<div class="wm-badge">${logo}</div>`;
}

function popupPhotosHTML(ad, images){
  const list = (images && images.length) ? images : (ad.images || []);
  if (!list.length) return `<div class="popup-photos is-empty"></div>`;
  const shown = list.slice(0, 10);
  return `<div class="popup-photos-wrap">` +
    `<div class="popup-photos">` +
    shown.map((u, i) => `<div class="popup-photo">` +
      `<img src="${escapeHtml(u)}" alt="" loading="lazy" draggable="false" oncontextmenu="return false" ` +
      `onerror="this.parentElement.style.display='none'">` +
      watermarkHTML() +
      `</div>`).join("") +
    `</div>` +
    (shown.length > 1 ? `<div class="popup-photos-count">&#x1F4F7; ${shown.length}</div>` : "") +
    `</div>`;
}

function popupHTML(ad, images){
  const thb = priceValue(ad);

  const hasAc = amenities.includes("Air Conditioner");

        shownChips.map(c => `<span class="popup-chip">${escapeHtml(AMENITY_ICONS[c])}</span>`).join("") +

      `</div>` : "") +

/** Remplace la vignette unique du popup par la galerie complete de l'annonce. */
async function loadPopupPhotos(ad){
  const marker = markersById[ad.id];
  if (!marker) return;

  const slotOf = () => {
    const popup = marker.getPopup();
    if (!popup || !popup.isOpen()) return null;
    const el = popup.getElement();
    return el ? el.querySelector(".popup-photos-slot") : null;
  };

  const paint = images => {
    const slot = slotOf();
    if (!slot) return;
    slot.innerHTML = popupPhotosHTML(ad, images);
    marker.getPopup().update();
  };

  if (detailCache[ad.id]) { paint(detailCache[ad.id]); return; }

  // Skeleton seulement s'il n'y a rien a montrer en attendant.
  if (!(ad.images || []).length) {
    const slot = slotOf();
    if (slot) slot.innerHTML = `<div class="popup-photos"><div class="popup-photos-skel"></div></div>`;
  }

  try {
    const l = await fetch(`${API}/listings/${ad.id}`).then(r => r.json());
    detailCache[ad.id] = l.images || [];
  } catch (e) {
    detailCache[ad.id] = ad.images || [];
  }
  paint(detailCache[ad.id]);
}

function buildMap(){
  leafletMap = L.map("leaflet-map", { zoomControl: false });
  L.control.zoom({ position: "topright" }).addTo(leafletMap);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19,
  }).addTo(leafletMap);

  clusterGroup = L.markerClusterGroup({ maxClusterRadius: 50 });
  leafletMap.addLayer(clusterGroup);

  ads.forEach(ad => {
    // Visiteur non connecte: l'API decale la position et le signale par
    // location_approx (main.py::_approximate_position). Comme Airbnb, on
    // dessine alors une zone plutot qu'un point; le rayon doit rester
    // >= FUZZ_MAX_M cote API pour que la vraie position soit dedans.
    const marker = ad.location_approx
      ? L.circle([ad.latitude, ad.longitude], {
          radius: APPROX_RADIUS_M, color: "var(--accent)", weight: 2,
          fillColor: "var(--accent)", fillOpacity: .18,
        })
      : L.marker([ad.latitude, ad.longitude], { icon: pinIcon() });
    marker
      .bindPopup(popupHTML(ad), { maxWidth: 390, minWidth: 390, className: "popup-lg", autoPanPadding: [24, 24] });
    // La liste ne renvoie qu'une vignette par annonce (_thumbnail_map cote
    // API): la galerie complete n'est chargee qu'a l'ouverture du popup,
    // pour ne pas tirer ~45 images par annonce au chargement de la carte.
    marker.on("popupopen", () => loadPopupPhotos(ad));
    markersById[ad.id] = marker;
  });

  const bounds = L.latLngBounds(ads.map(a => [a.latitude, a.longitude]));
  leafletMap.fitBounds(bounds, { padding: [30, 30] });
}

function hasRaw(raw){
  return !!raw && String(raw).trim() !== "-" && String(raw).trim() !== "";
}

function parseRaw(raw){
  if (!hasRaw(raw)) return null;
  const m = String(raw).match(/[\d,\s]+/);
  if (!m) return null;
  const n = parseInt(m[0].replace(/[\s,]/g, ""), 10);
  return Number.isFinite(n) ? n : null;
}

// Même logique que priceOf() dans payant.html : le prix du contrat
// correspondant à la durée choisie, sinon le prix général de l'annonce.
function priceOf(ad, durationField){
  if (durationField) {
    const min = ad[`${durationField}_min`];
    if (min) return min;
    const n = parseRaw(ad[`${durationField}_raw`]);
    if (n !== null) return n;
  }
  if (ad.price_monthly_min) return ad.price_monthly_min;
  return parseRaw(ad.contract_monthly_raw);
}

const BUDGET_MIN = 10;
const BUDGET_MAX = 500;

function setupBudgetSlider(){
  const minInput = document.getElementById("budget-min");
  const maxInput = document.getElementById("budget-max");
  const minLabel = document.getElementById("budget-min-label");
  const maxLabel = document.getElementById("budget-max-label");
  const fill = document.getElementById("budget-fill");

  function render(){
    let min = Number(minInput.value);
    let max = Number(maxInput.value);
    if (min > max) {
      [min, max] = [max, min];
      minInput.value = min;
      maxInput.value = max;
    }

    const pctMin = ((min - BUDGET_MIN) / (BUDGET_MAX - BUDGET_MIN)) * 100;
    const pctMax = ((max - BUDGET_MIN) / (BUDGET_MAX - BUDGET_MIN)) * 100;
    fill.style.left = pctMin + "%";
    fill.style.width = (pctMax - pctMin) + "%";

    minLabel.textContent = min + " €";
    maxLabel.textContent = max >= BUDGET_MAX ? BUDGET_MAX + " €+" : max + " €";

    selectedBudget = (min === BUDGET_MIN && max === BUDGET_MAX)
      ? null
      : { min, max: max >= BUDGET_MAX ? Infinity : max };
    applyFilters();
  }

  minInput.addEventListener("input", render);
  maxInput.addEventListener("input", render);
  render();
}

function setupFormFilters(){
  setupBudgetSlider();

  document.querySelectorAll("#f-duration .chip[data-value]").forEach(chip => {
    chip.addEventListener("click", () => {
      const wasActive = chip.classList.contains("active");
      document.querySelectorAll("#f-duration .chip").forEach(c => c.classList.remove("active"));
      if (!wasActive) chip.classList.add("active");
      selectedDuration = wasActive ? "" : chip.dataset.value;
      applyFilters();
    });
  });

  document.getElementById("chip-new").addEventListener("click", () => {
    onlyNew = !onlyNew;
    document.getElementById("chip-new").classList.toggle("active", onlyNew);
    applyFilters();
  });

  document.querySelectorAll("#f-amenities .chip[data-value]").forEach(chip => {
    chip.addEventListener("click", () => {
      const value = chip.dataset.value;
      if (selectedAmenities.has(value)) {
        selectedAmenities.delete(value);
        chip.classList.remove("active");
      } else {
        selectedAmenities.add(value);
        chip.classList.add("active");
      }
      applyFilters();
    });
  });
}

function applyFilters(){
  const durationField = DURATION_FIELD[selectedDuration] || null;

  const filtered = ads.filter(a => {
    if (durationField && !hasRaw(a[`${durationField}_raw`])) return false;
    if (onlyNew) {
      const cutoff = Date.now() - 24 * 60 * 60 * 1000;
      if (new Date(a.first_seen_at || 0).getTime() < cutoff) return false;
    }
    if (selectedBudget) {
      const minThb = selectedBudget.min * EUR_TO_THB;
      const maxThb = selectedBudget.max * EUR_TO_THB;
      const p = priceOf(a, durationField);
      if (p == null || p < minThb || p > maxThb) return false;
    }
    if (selectedAmenities.size) {
      const amenities = a.amenities || [];
      for (const am of selectedAmenities) {
        if (!amenities.includes(am)) return false;
      }
    }
    return true;
  });
  clusterGroup.clearLayers();
  clusterGroup.addLayers(filtered.map(a => markersById[a.id]).filter(Boolean));

  const countEl = document.getElementById("result-count");
  if (countEl) countEl.textContent = `${filtered.length.toLocaleString("fr-FR")} annonce${filtered.length > 1 ? "s" : ""}`;
}

async function loadAds(){
  const limit = 500;
  let offset = 0;
  const data = [];

  try {
    while (true) {
      const r = await fetch(`${API}/listings?status=active&limit=${limit}&offset=${offset}`);
      if (!r.ok) throw new Error(r.status);
      const batch = await r.json();
      if (!Array.isArray(batch)) throw new Error("Réponse /listings invalide");
      data.push(...batch);
      if (batch.length < limit) break;
      offset += limit;
    }
  } catch (e) {
    document.getElementById("leaflet-map").innerHTML =
      `<div class="empty">Impossible de charger les annonces depuis l'API.<br><br>Vérifie que FastAPI fonctionne sur le port 8000.</div>`;
    return;
  }

  ads = data.filter(a => Number.isFinite(a.latitude) && Number.isFinite(a.longitude));

  if (!ads.length) {
    document.getElementById("leaflet-map").innerHTML = `<div class="empty">Aucune annonce géolocalisée.</div>`;
    return;
  }

  buildMap();
  setupFormFilters();
  applyFilters();
}

// ── Modal (détail annonce, porté depuis index.html) ──

const MIN_VALID_PRICE = 1000;
function contractNum(raw) {
  if (!raw || raw.trim() === "-" || raw.trim() === "") return null;
  const nums = (raw.match(/[\d,]+/g) || [])
    .map(s => parseInt(s.replace(/,/g, ""), 10))
    .filter(n => Number.isFinite(n) && n > 0);
  if (!nums.length) return null;

  const low = nums[0];
  const high = nums[nums.length - 1];
  if (low >= MIN_VALID_PRICE) return low;
  if (high >= MIN_VALID_PRICE) return high;
  return null;
}

function contractVal(raw) {
  const n = contractNum(raw);
  if (n === null) return "—";

  const eur = n / 38.28;

  const thb = n.toLocaleString("fr-FR");
  const euros = eur.toLocaleString("fr-FR", {
    maximumFractionDigits: 0
  });

  return `${thb} ฿<br>${euros} €`;
}

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// ── Pagination ────────────────────────────────────────────────────────

let lastFocusedEl = null;

async function openModal(id) {
  lastFocusedEl = document.activeElement;
  document.getElementById("overlay").classList.add("open");
  const body = document.getElementById("modal-body");
  body.innerHTML = `<div class="state-box"><div class="spinner"></div></div>`;
  body.focus();
  try {
    const l = await fetch(`${API}/listings/${id}`).then(r => r.json());
    body.innerHTML = modalHTML(l);
    currentGalleryImages = l.images || [];
  } catch(e) {
    body.innerHTML = `<div class="state-box">Erreur de chargement</div>`;
  }
}

function openLightbox(i) {
  currentLightboxIndex = i;
  document.getElementById("lightbox-img").src = currentGalleryImages[i] || "";
  document.getElementById("lightbox-overlay").classList.add("open");
  const showNav = currentGalleryImages.length > 1;
  document.getElementById("lightbox-prev").disabled = !showNav;
  document.getElementById("lightbox-next").disabled = !showNav;
}
function closeLightbox(e) {
  if (e && e.target !== document.getElementById("lightbox-overlay")) return;
  document.getElementById("lightbox-overlay").classList.remove("open");
  document.getElementById("lightbox-img").src = "";
}
function navigateLightbox(delta) {
  if (!currentGalleryImages.length) return;
  currentLightboxIndex = (currentLightboxIndex + delta + currentGalleryImages.length) % currentGalleryImages.length;
  document.getElementById("lightbox-img").src = currentGalleryImages[currentLightboxIndex];
}

let lightboxTouchStartX = null;
document.getElementById("lightbox-overlay").addEventListener("touchstart", e => {
  lightboxTouchStartX = e.changedTouches[0].clientX;
}, { passive: true });
document.getElementById("lightbox-overlay").addEventListener("touchend", e => {
  if (lightboxTouchStartX === null) return;
  const delta = e.changedTouches[0].clientX - lightboxTouchStartX;
  lightboxTouchStartX = null;
  if (Math.abs(delta) < 40) return;
  navigateLightbox(delta > 0 ? -1 : 1);
}, { passive: true });

function trapModalFocus(e) {
  if (e.key !== "Tab") return;
  const overlay = document.getElementById("overlay");
  if (!overlay.classList.contains("open")) return;
  const focusable = document.getElementById("modal-body")
    .querySelectorAll('a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}
document.addEventListener("keydown", trapModalFocus);

// La carte ne charge pas les caches de geocodage d'index.html : seules les
// coordonnees propres de l'annonce servent (une annonce sans position
// n'apparait de toute facon pas sur la carte).
function mapPoint(l) {
  if (l.latitude != null && l.longitude != null) {
    return { lat: l.latitude, lon: l.longitude, precise: !l.location_approx };
  }
  return null;
}

function mapQuery(l) {
  const pt = mapPoint(l);
  if (pt) return `${pt.lat},${pt.lon}`;
  const q = l.address || [l.subdistrict, l.district, l.province].filter(Boolean).join(", ");
  return q ? `${q}, Thailand` : null;
}

function googleMapsUrl(l) {
  const q = mapQuery(l);
  if (!q) return null;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}

// Embed public sans clé API (endpoint historique `output=embed`) — pas
// aussi précis/officiel que l'API Maps Embed payante, mais suffisant
// pour situer un point sur une carte interactive intégrée à la modal.
function googleMapsEmbedUrl(l) {
  const q = mapQuery(l);
  if (!q) return null;
  const pt = mapPoint(l);
  const zoom = pt && pt.precise ? 17 : (pt ? 15 : 13);
  return `https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=${zoom}&output=embed`;
}

const humanizeRoomType = s => s ? s.toLowerCase().replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : null;

function roomTypeLabel(rt) {
  const roomType = humanizeRoomType(rt.room_type);
  return [
    rt.name && rt.name !== "Unknown" ? rt.name : null,
    roomType && roomType !== rt.name ? roomType : null,
    rt.size_sqm ? `${rt.size_sqm} m²` : null,
  ].filter(Boolean).join(" · ");
}

function contractRooms(l) {
  const rooms = (l.room_types || []).filter(rt =>
    rt.monthly_min_thb != null || rt.monthly_max_thb != null ||
    rt.contract_1_month_thb != null || rt.contract_3_month_thb != null || rt.contract_6_month_thb != null);
  const available = rooms.filter(rt => !rt.status || rt.status.trim().toLowerCase() === "available");
  return available.length ? available : rooms;
}

function contractsSectionTitle(l) {
  const useRooms = contractRooms(l);
  if (useRooms.length === 1) {
    const label = roomTypeLabel(useRooms[0]);
    if (label) return label;
  }
  return "Room Type";
}

function renderContractsHTML(l) {
  const fmt = n => n == null ? null : `${n.toLocaleString("en-US")} THB/month`;
  const useRooms = contractRooms(l);

  if (useRooms.length) {
    return useRooms.map(rt => {
      const label = roomTypeLabel(rt);
      const terms = [
        ["1 mois", fmt(rt.contract_1_month_thb)],
        ["3 mois", fmt(rt.contract_3_month_thb)],
        ["6 mois", fmt(rt.contract_6_month_thb)],
      ].filter(([, v]) => v != null);
      if (!terms.length) return "";
      const termsHTML = terms.map(([term, v]) => `
        <div class="mc">
          <div class="mc-label">${term}</div>
          <div class="mc-val">${esc(v)}</div>
        </div>`).join("");
      if (useRooms.length <= 1) return termsHTML;
      return `
        <div class="mc-room-group">
          ${label ? `<div class="mc-room-label">${esc(label)}</div>` : ""}
          <div class="mc-room-terms">${termsHTML}</div>
        </div>`;
    }).join("");
  }

  const contracts = [["1 mois", l.contract_monthly_raw], ["3 mois", l.contract_3_month_raw], ["6 mois", l.contract_6_month_raw]]
    .filter(([, raw]) => raw && raw !== "-");
  if (!contracts.length) return `<div class="mc"><div class="mc-val na">Aucun contrat disponible</div></div>`;
  return contracts.map(([label, raw]) => `
        <div class="mc">
          <div class="mc-label">${label}</div>
          <div class="mc-val">${esc(raw)}</div>
        </div>`).join("");
}

function modalHTML(l) {
  const locs = [l.subdistrict, l.district, l.province].filter(Boolean);
  const amenities = l.amenities || [];
  const mapsUrl = googleMapsUrl(l);
  const embedUrl = googleMapsEmbedUrl(l);
  const pt = mapPoint(l);
  const precisionLabel = !pt ? ""
    : pt.precise ? "📌 Position précise"
    : l.location_approx ? "🔵 Position approximative (zone de ~350 m — connectez-vous pour la position exacte)"
    : "🔵 Position approximative (centre du quartier — RentHub ne publie pas l'adresse exacte)";

  return `
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()" aria-label="Fermer">✕</button>
    </div>
    ${l.images && l.images.length ? `
    <div class="modal-gallery">
      ${l.images.map((u, i) => `<div class="modal-gallery-item"><img src="${esc(u)}" alt="" loading="lazy" draggable="false" oncontextmenu="return false" onclick="openLightbox(${i})" onerror="this.parentElement.style.display='none'">${watermarkHTML()}</div>`).join("")}
    </div>` : ""}
    <div class="modal-tags">
      ${locs.map(loc => `<span class="tag">${esc(loc)}</span>`).join("")}
      ${l.has_monthly_contract === "true" && contractVal(l.contract_monthly_raw) !== "—" ? `<span class="badge badge-monthly" style="position:static;display:inline-block">1 MOIS</span>` : ""}
      ${contractVal(l.contract_3_month_raw) !== "—" ? `<span class="badge badge-term-3" style="position:static;display:inline-block">3 MOIS</span>` : ""}
      ${contractVal(l.contract_6_month_raw) !== "—" ? `<span class="badge badge-term-6" style="position:static;display:inline-block">6 MOIS</span>` : ""}
    </div>
    ${mapsUrl ? `
    <div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap">
        <a class="modal-link" style="padding:6px 12px;font-size:11px" href="${esc(mapsUrl)}" target="_blank" rel="noopener">📍 Google Maps ↗</a>
      </div>
      ${embedUrl ? `<iframe src="${esc(embedUrl)}" style="width:100%;height:220px;border:0;border-radius:8px;margin-top:10px" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Carte de localisation"></iframe>` : ""}
      ${precisionLabel ? `<div style="font-size:10px;color:var(--muted);margin-top:6px">${precisionLabel}</div>` : ""}
    </div>` : ""}
    <div>
      <div class="section-head">${esc(contractsSectionTitle(l))}</div>
      <div class="modal-contracts">
        ${renderContractsHTML(l)}
      </div>
    </div>
    ${l.deposit || (l.electric_price && l.electric_price !== "Please contact") || amenities.length ? `
    <div>
      <div class="section-head">Description</div>
      <div class="modal-contracts">
        <div class="mc"><div class="mc-label">Deposit</div><div class="mc-val${l.deposit ? "" : " na"}">${l.deposit ? esc(l.deposit) : "Non communiqué"}</div></div>
        ${l.electric_price && l.electric_price !== "Please contact" ? `<div class="mc"><div class="mc-label">Electric price</div><div class="mc-val">${esc(l.electric_price)}</div></div>` : ""}
        <div class="mc"><div class="mc-label">Air Conditioner</div><div class="mc-val${amenities.includes("Air Conditioner") ? "" : " na"}">${amenities.includes("Air Conditioner") ? "YES" : "NO"}</div></div>
      </div>
    </div>` : ""}
    ${amenities.length ? `
    <div>
      <div class="section-head">Équipements</div>
      <div class="modal-amenities">${amenities.map(a=>`<span class="amenity">${esc(AMENITY_ICONS[a] || a)}</span>`).join("")}</div>
    </div>` : ""}
    ${(()=>{const hasWa=hasRealWhatsapp(l.whatsapp);return l.phone||l.line_id||hasWa ? `
    <div>
      <div class="section-head">Contact</div>
      <div class="modal-contracts">
        ${l.phone?`<div class="mc"><div class="mc-label">Téléphone</div><div class="mc-val">📞 ${esc(l.phone)}</div></div>`:""}
        ${l.line_id?(()=>{
          // line_verified===false : identifiant deja confirme inexistant par
          // scripts/verify_line_ids.py -- on route vers line.me/ti/p/~<id>
          // pour eviter un 404 (voir Listing.line_verified). Sinon (valide ou
          // jamais verifie), page.line.me/<id> reste le lien qui marche vraiment.
          const slug = encodeURIComponent(String(l.line_id).replace(/^@/,""));
          const href = l.line_verified===false ? `https://line.me/ti/p/~${slug}` : `https://page.line.me/${slug}`;
          return `<a class="mc mc-line" href="${href}" target="_blank" rel="noopener"><div class="mc-label">LINE</div><div class="mc-val" style="display:flex;align-items:center;gap:6px">${LINE_ICON_SVG} ${esc(l.line_id)}</div></a>`;
        })():""}
        ${hasWa?`<a class="mc mc-wa" href="https://api.whatsapp.com/send/?phone=${encodeURIComponent(String(l.whatsapp).replace(/\D/g,""))}&text&type=phone_number&app_absent=0" target="_blank" rel="noopener"><div class="mc-label">WhatsApp</div><div class="mc-val" style="display:flex;align-items:center;gap:6px">${WHATSAPP_ICON_SVG} ${esc(formatWhatsapp(l.whatsapp))}</div></a>`:""}
      </div>
    </div>` : "";})()}
    <a class="modal-link" href="${esc(l.url)}" target="_blank" rel="noopener">Voir sur RentHub ↗</a>
  `;
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("overlay")) return;
  document.getElementById("overlay").classList.remove("open");
  if (lastFocusedEl) { lastFocusedEl.focus(); lastFocusedEl = null; }
}
document.addEventListener("keydown", e => {
  const lightboxOpen = document.getElementById("lightbox-overlay").classList.contains("open");
  if (lightboxOpen && e.key === "ArrowLeft") { navigateLightbox(-1); return; }
  if (lightboxOpen && e.key === "ArrowRight") { navigateLightbox(1); return; }
  if (e.key !== "Escape") return;
  if (lightboxOpen) { closeLightbox(); return; }
  closeModal();
});

// Pas de clic droit / glisser / selection sur les photos (popup de la carte,
// galerie de la modale, lightbox). Le popup Leaflet est insere dynamiquement,
// d'ou l'ecoute au niveau du document.
["contextmenu", "dragstart", "selectstart", "copy"].forEach(eventName => {
  document.addEventListener(eventName, event => {
    if (event.target.closest(".popup-photos-wrap, .modal-gallery, .lightbox-overlay")) event.preventDefault();
  });
});

loadAds();
</script>
