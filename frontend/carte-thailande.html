<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiMonth — Carte Thaïlande</title>
<meta property="og:title" content="ThaiMonth — Carte Thaïlande">
<meta property="og:description" content="Toutes les annonces actives géolocalisées en Thaïlande">
<meta property="og:image" content="/static/logo.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/css/map.css">
<link rel="stylesheet" href="/static/css/modal.css">
<link rel="stylesheet" href="/static/css/common.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #faf8f4;
    --surface:  #ffffff;
    --card:     #ffffff;
    --border:   #e9e4da;
    --accent:   #5046f5;
    --accent-ink: #ffffff;
    --brand-lime: #c7ef6c;
    --brand-gold: #e8b765;
    --green:    #2f9e44;
    --blue:     #5046f5;
    --purple:   #7950f2;
    --text:     #14130f;
    --muted:    #6c6660;
    --dim:      #9b948b;
    --focus:    #5046f5;
    --mono:     'Plus Jakarta Sans', system-ui, sans-serif;
    --sans:     'Plus Jakarta Sans', system-ui, sans-serif;
    --r-pill:   9999px;
    --r-card:   20px;
    --r-ctl:    12px;
    --sky-1:    #cfe8b8;
    --sky-2:    #dcd6f9;
    --sky-3:    #cde8f4;
  }

  /* Popup "fiche": la carte occupe toute la bulle, la photo vient a fond
     perdu, d'ou la marge nulle et l'overflow masque. */
  .popup-lg .leaflet-popup-content-wrapper{ padding:0;overflow:hidden;border-radius:var(--r-card) }
  .popup-lg .leaflet-popup-content{ margin:0;width:390px !important;line-height:1.45 }
  .popup-lg .leaflet-popup-close-button{
    color:#fff !important;background:rgba(20,19,15,.45);backdrop-filter:blur(4px);
    border-radius:50%;width:26px !important;height:26px !important;
    line-height:24px !important;top:10px !important;right:10px !important;
    font-size:16px !important;z-index:5;transition:background .15s
  }
  .popup-lg .leaflet-popup-close-button:hover{ background:rgba(20,19,15,.7) }

  .popup-card{ display:flex;flex-direction:column;max-height:82vh }

  /* Photos */
  .popup-photos-wrap{ position:relative }
  .popup-photos{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    background:var(--border);scrollbar-width:none
  }
  .popup-photos::-webkit-scrollbar{ display:none }
  .popup-photos.is-empty{ display:none }
  .popup-photo{ position:relative;flex:0 0 100%;height:200px;scroll-snap-align:center }
  .popup-photo img{
    height:200px;width:100%;object-fit:cover;display:block;background:var(--border);
    transform:scaleX(-1);cursor:default;pointer-events:none;
    -webkit-user-drag:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none
  }
  /* Filigrane texte "ThaiMonth" (memes couleurs que le logo de l'en-tete):
     motif repete sur toute la photo + pastille pleine en bas a droite. */
  .wm-tile{
    position:absolute;inset:-40%;display:flex;flex-wrap:wrap;gap:6px 10px;
    align-content:space-around;justify-content:space-around;
    transform:rotate(-18deg);pointer-events:none;user-select:none;opacity:.9
  }
  .wm-tile span{
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.4px;
    white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.35)
  }
  .wm-thai{ color:var(--brand-lime) }
  .wm-month{ color:var(--brand-gold) }
  .wm-badge{
    position:absolute;right:10px;bottom:10px;pointer-events:none;user-select:none;
    background:#1d3c10;border-radius:var(--r-pill);padding:6px 13px;
    font-family:var(--sans);font-weight:800;font-size:15px;letter-spacing:-.4px;
    line-height:1;box-shadow:0 3px 10px rgba(20,19,15,.35)
  }
  .modal-gallery-item .wm-tile span{ font-size:17px }
  .modal-gallery-item .wm-badge{ font-size:18px;padding:8px 16px;right:12px;bottom:12px }
  .popup-photos-count{
    position:absolute;left:10px;bottom:10px;z-index:3;pointer-events:none;
    background:rgba(20,19,15,.6);backdrop-filter:blur(4px);color:#fff;
    border-radius:var(--r-pill);padding:3px 9px;
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em
  }
  .popup-photos-skel{
    height:200px;width:100%;flex:0 0 100%;
    background:linear-gradient(90deg,var(--border) 25%,var(--bg) 50%,var(--border) 75%);
    background-size:200% 100%;animation:popup-skel 1.2s linear infinite
  }
  @keyframes popup-skel{ from{background-position:200% 0} to{background-position:-200% 0} }

  /* Corps scrollable */
  .popup-body{ padding:14px 16px 4px;overflow-y:auto;display:flex;flex-direction:column;gap:12px }

  .popup-price{ display:flex;align-items:baseline;gap:7px;flex-wrap:wrap }
  .popup-price-thb{ font-weight:800;color:var(--text);font-size:22px;line-height:1.05;letter-spacing:-.5px }
  .popup-price-unit{ font-size:12px;font-weight:600;color:var(--muted) }
  .popup-price-eur{ font-size:11px;color:var(--dim);font-weight:600 }
  .popup-loc{ font-size:11.5px;color:var(--muted);margin-top:6px }

  .popup-badges{ display:flex;flex-wrap:wrap;gap:5px;margin-top:8px }
  .popup-badge{
    border-radius:var(--r-pill);padding:3px 9px;font-size:9.5px;font-weight:800;
    font-family:var(--mono);letter-spacing:.06em;color:#fff;white-space:nowrap
  }
  .popup-badge-1{ background:var(--accent) }
  .popup-badge-3{ background:var(--purple) }
  .popup-badge-6{ background:var(--brand-gold);color:var(--text) }

  /* Specs en lignes label/valeur: plus calme que des cartes empilees,
     et aligne sur le rendu de la modale. */
  .popup-specs{
    border:1px solid var(--border);border-radius:var(--r-ctl);
    background:var(--bg);overflow:hidden
  }
  .popup-spec{
    display:flex;align-items:baseline;justify-content:space-between;gap:14px;
    padding:8px 12px;border-bottom:1px solid var(--border)
  }
  .popup-spec:last-child{ border-bottom:none }
  .popup-spec-label{
    font-size:9.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;
    color:var(--dim);white-space:nowrap;flex-shrink:0
  }
  .popup-spec-val{ font-size:12px;font-weight:700;color:var(--text);text-align:right;word-break:break-word }
  .popup-spec-val.na{ color:var(--dim);font-weight:500 }
  .popup-spec-val.yes{ color:var(--green) }

  .popup-section-head{
    font-size:9.5px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim);margin-bottom:6px
  }
  .popup-rooms{ display:grid;grid-template-columns:1fr;gap:6px }
  .popup-rooms .mc{ padding:8px 12px }
  .popup-rooms .mc-val{ font-size:12px }
  .popup-rooms .mc-room-group{ padding:9px;gap:6px }
  .popup-rooms .mc-room-label{ font-size:9.5px }
  .popup-rooms .mc-room-terms{ gap:6px }
  .popup-rooms .mc-room-terms .mc{ flex:1 1 80px;padding:7px 9px }

  .popup-amenities{ display:flex;flex-wrap:wrap;gap:5px }
  .popup-chip{
    background:var(--card);border:1px solid var(--border);border-radius:var(--r-pill);
    padding:3px 9px;font-size:10.5px;color:var(--muted);white-space:nowrap
  }
  .popup-chip-more{ background:var(--bg);color:var(--dim);font-weight:700 }

  /* Footer colle: le CTA reste visible meme si le corps defile. */
  .popup-actions{
    position:sticky;bottom:0;padding:12px 16px 14px;background:var(--card);
    border-top:1px solid var(--border);display:flex;gap:6px
  }
  /* `.leaflet-container a` (0,1,1) bat `.popup-btn` (0,1,0): sans ce
     selecteur le libelle prend le bleu de lien Leaflet sur fond violet. */
  .leaflet-container a.popup-btn{
    flex:1;text-align:center;background:var(--accent);color:var(--accent-ink);
    text-decoration:none;padding:11px 14px;border-radius:var(--r-pill);
    font-size:12.5px;font-weight:700;transition:filter .15s
  }
  .leaflet-container a.popup-btn:hover{ filter:brightness(1.12) }

  /* ── Modale (portee depuis index.html) ── */
  .modal-gallery-item .photo-watermark {
    position: absolute;
    right: 8px;
    bottom: 8px;
    transform: none;
    width: auto;
    height: 55px;
    opacity: 1;
    pointer-events: none;
    background: none;
  }

  .photo-watermark-tile {
    position: absolute;
    inset: 0;
    background-image: url('/static/logo.png');
    background-repeat: repeat;
    background-size: 70px auto;
    opacity: .45;
    pointer-events: none;
  }
  .modal-gallery-item .photo-watermark-tile {
    background-size: 90px auto;
  }
  .modal-gallery-item {
    position: relative;
    flex-shrink: 0;
    height: 220px;
    max-width: 85%;
    scroll-snap-align: start;
  }
  .modal-gallery-item img {
    height: 220px;
    width: auto;
    max-width: 100%;
    object-fit: cover;
    border-radius: 8px;
    background: var(--border);
    transform: scaleX(-1);
    -webkit-user-drag: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: zoom-in;
  }
  .modal-gallery-item .photo-watermark {
    height: 85px;
    bottom: 12px;
    right: 12px;
  }

  .badge {
    position: absolute;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    letter-spacing: .05em;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,19,15,.45);
    backdrop-filter: blur(8px);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .lightbox-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 4000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-content img#lightbox-img {
    display: block;
    max-width: 95vw;
    max-height: 95vh;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: 8px;
    background: var(--border);
    transform: scaleX(-1);
    -webkit-user-drag: none;
    user-select: none;
    -webkit-touch-callout: none;
    cursor: default;
  }
  .lightbox-prev { left: 20px; }
  .lightbox-next { right: 20px; }
  .modal-close {
    background: none; border: 1px solid var(--border);
    border-radius: var(--r-pill); color: var(--muted);
    width: 28px; height: 28px; cursor: pointer;
    font-size: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: color .15s;
  }
  .mc-val {
    font-size: 13px; font-weight: 700;
    font-family: var(--mono); color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="/test" aria-label="ThaiMonth">
    <span class="logo-thai">Thai</span><span class="logo-month">Month</span>
  </a>
  <a class="header-list" href="/premium.html">Voir les annonces</a>
</header>

<main>
  <section id="map">
    <div id="leaflet-map"></div>
    <div class="controls">
      <div class="filter-section">
        <div class="filter-label">Résultats</div>
        <div class="budget-values"><span id="result-count">— annonces</span></div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Budget (€ / mois)</div>
        <div class="budget-values">
          <span id="budget-min-label">10 €</span>
          <span id="budget-max-label">500 €+</span>
        </div>
        <div class="range-slider" id="f-budget">
          <div class="range-track"></div>
          <div class="range-fill" id="budget-fill"></div>
          <input type="range" id="budget-min" min="10" max="500" step="10" value="10">
          <input type="range" id="budget-max" min="10" max="500" step="10" value="500">
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Durée du séjour</div>
        <div class="chip-group" id="f-duration">
          <button type="button" class="chip" data-value="1 mois">1 mois</button>
          <button type="button" class="chip" data-value="3 mois">3 mois</button>
          <button type="button" class="chip" data-value="6 mois">6 mois</button>
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Équipements</div>
        <div class="chip-group" id="f-amenities">
          <button type="button" class="chip" id="chip-new">🆕 New</button>
          <button type="button" class="chip" data-value="Pool">🏊 Pool</button>
          <button type="button" class="chip" data-value="Fitness">🏋️ Fitness</button>
          <button type="button" class="chip" data-value="Desk">🖥️ Desk</button>
          <button type="button" class="chip" data-value="In-room WIFI">📶 WIFI</button>
          <button type="button" class="chip" data-value="Television">📺 TV</button>
          <button type="button" class="chip" data-value="Beauty Salon in Building">💇 Beautiful</button>
          <button type="button" class="chip" data-value="Parking">🅿️ Parking</button>
          <button type="button" class="chip" data-value="Smoking">🚬 Smoking</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-body" role="dialog" aria-modal="true" aria-label="Détail de l'annonce" tabindex="-1"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox-overlay" id="lightbox-overlay" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Fermer">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" onclick="navigateLightbox(-1)" aria-label="Photo précédente">‹</button>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" onclick="navigateLightbox(1)" aria-label="Photo suivante">›</button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="" draggable="false" oncontextmenu="return false">
  </div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/modal.js"></script>
<script src="/static/js/map.js"></script>
<script>

const APPROX_RADIUS_M = 350;

function pinIcon(){
  return L.divIcon({ className: "", html: `<div class="pin-icon"></div>`, iconSize: [12, 12] });
}

const POPUP_MAX_CHIPS = 6;
const detailCache = {};

function popupSpec(label, value, cls){
  const has = value != null && value !== "" && value !== "-" && value !== "Please contact";
  return `<div class="popup-spec">` +
    `<span class="popup-spec-label">${escapeHtml(label)}</span>` +
    `<span class="popup-spec-val${has ? (cls ? " " + cls : "") : " na"}">${has ? escapeHtml(value) : "Non communiqu&eacute;"}</span>` +
    `</div>`;
}

function popupPhotosHTML(ad, images){
  const list = (images && images.length) ? images : (ad.images || []);
  if (!list.length) return `<div class="popup-photos is-empty"></div>`;
  const shown = list.slice(0, 10);
  return `<div class="popup-photos-wrap">` +
    `<div class="popup-photos">` +
    shown.map((u, i) => `<div class="popup-photo">` +
      `<img src="${escapeHtml(u)}" alt="" loading="lazy" draggable="false" oncontextmenu="return false" ` +
      `onerror="this.parentElement.style.display='none'">` +
      watermarkHTML() +
      `</div>`).join("") +
    `</div>` +
    (shown.length > 1 ? `<div class="popup-photos-count">&#x1F4F7; ${shown.length}</div>` : "") +
    `</div>`;
}

function popupHTML(ad, images){
  const thb = priceValue(ad);
  const amenities = ad.amenities || [];
  const hasAc = amenities.includes("Air Conditioner");
  const chips = amenityChips(ad);
  const shownChips = chips.slice(0, POPUP_MAX_CHIPS);
  const extra = chips.length - shownChips.length;
  const locs = [ad.subdistrict, ad.district, ad.province].filter(Boolean);
  const badges =
    (ad.has_monthly_contract === "true" && contractNum(ad.contract_monthly_raw) !== null ? `<span class="popup-badge popup-badge-1">1 mois</span>` : "") +
    (contractNum(ad.contract_3_month_raw) !== null ? `<span class="popup-badge popup-badge-3">3 mois</span>` : "") +
    (contractNum(ad.contract_6_month_raw) !== null ? `<span class="popup-badge popup-badge-6">6 mois</span>` : "");

  const priceHTML = thb
    ? `<span class="popup-price-thb">${thb.toLocaleString("fr-FR")} &#x0E3F;</span>` +
      `<span class="popup-price-unit">/ mois</span>` +
      `<span class="popup-price-eur">&asymp; ${Math.round(thb / EUR_TO_THB).toLocaleString("fr-FR")} &euro;</span>`
    : `<span class="popup-price-unit">Prix non communiqu&eacute;</span>`;

  return `<div class="popup-card">` +
    `<div class="popup-photos-slot">${popupPhotosHTML(ad, images)}</div>` +
    `<div class="popup-body">` +
      `<div>` +
        `<div class="popup-price">${priceHTML}</div>` +
        (locs.length ? `<div class="popup-loc">&#x1F4CD; ${locs.map(escapeHtml).join(" &middot; ")}</div>` : "") +
        (badges ? `<div class="popup-badges">${badges}</div>` : "") +
      `</div>` +
      `<div class="popup-specs">` +
        popupSpec("Deposit", ad.deposit) +
        popupSpec("\u00c9lectricit\u00e9", ad.electric_price) +
        popupSpec("Climatisation", hasAc ? "\u2713 Oui" : "Non", hasAc ? "yes" : "") +
      `</div>` +
      `<div><div class="popup-section-head">${escapeHtml(contractsSectionTitle(ad))}</div>` +
      `<div class="popup-rooms">${renderContractsHTML(ad)}</div></div>` +
      (shownChips.length ? `<div class="popup-amenities">` +
        shownChips.map(c => `<span class="popup-chip">${escapeHtml(AMENITY_ICONS[c])}</span>`).join("") +
        (extra > 0 ? `<span class="popup-chip popup-chip-more">+${extra}</span>` : "") +
      `</div>` : "") +
    `</div>` +
    `<div class="popup-actions">` +
      `<a href="payant.html?listing=${encodeURIComponent(ad.id)}" class="popup-btn">Voir l'annonce compl\u00e8te</a>` +
    `</div>` +
  `</div>`;
}

/** Remplace la vignette unique du popup par la galerie complete de l'annonce. */
async function loadPopupPhotos(ad){
  const marker = markersById[ad.id];
  if (!marker) return;

  const slotOf = () => {
    const popup = marker.getPopup();
    if (!popup || !popup.isOpen()) return null;
    const el = popup.getElement();
    return el ? el.querySelector(".popup-photos-slot") : null;
  };

  const paint = images => {
    const slot = slotOf();
    if (!slot) return;
    slot.innerHTML = popupPhotosHTML(ad, images);
    marker.getPopup().update();
  };

  if (detailCache[ad.id]) { paint(detailCache[ad.id]); return; }

  // Skeleton seulement s'il n'y a rien a montrer en attendant.
  if (!(ad.images || []).length) {
    const slot = slotOf();
    if (slot) slot.innerHTML = `<div class="popup-photos"><div class="popup-photos-skel"></div></div>`;
  }

  try {
    const l = await fetch(`${API}/listings/${ad.id}`).then(r => r.json());
    detailCache[ad.id] = l.images || [];
  } catch (e) {
    detailCache[ad.id] = ad.images || [];
  }
  paint(detailCache[ad.id]);
}

function buildMap(){
  leafletMap = L.map("leaflet-map", { zoomControl: false });
  L.control.zoom({ position: "topright" }).addTo(leafletMap);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19,
  }).addTo(leafletMap);

  clusterGroup = L.markerClusterGroup({ maxClusterRadius: 50 });
  leafletMap.addLayer(clusterGroup);

  ads.forEach(ad => {
    // Visiteur non connecte: l'API decale la position et le signale par
    // location_approx (main.py::_approximate_position). Comme Airbnb, on
    // dessine alors une zone plutot qu'un point; le rayon doit rester
    // >= FUZZ_MAX_M cote API pour que la vraie position soit dedans.
    const marker = ad.location_approx
      ? L.circle([ad.latitude, ad.longitude], {
          radius: APPROX_RADIUS_M, color: "var(--accent)", weight: 2,
          fillColor: "var(--accent)", fillOpacity: .18,
        })
      : L.marker([ad.latitude, ad.longitude], { icon: pinIcon() });
    marker
      .bindPopup(popupHTML(ad), { maxWidth: 390, minWidth: 390, className: "popup-lg", autoPanPadding: [24, 24] });
    // La liste ne renvoie qu'une vignette par annonce (_thumbnail_map cote
    // API): la galerie complete n'est chargee qu'a l'ouverture du popup,
    // pour ne pas tirer ~45 images par annonce au chargement de la carte.
    marker.on("popupopen", () => loadPopupPhotos(ad));
    markersById[ad.id] = marker;
  });

  const bounds = L.latLngBounds(ads.map(a => [a.latitude, a.longitude]));
  leafletMap.fitBounds(bounds, { padding: [30, 30] });
}

function applyFilters(){
  const durationField = DURATION_FIELD[selectedDuration] || null;

  const filtered = ads.filter(a => {
    if (durationField && !hasRaw(a[`${durationField}_raw`])) return false;
    if (onlyNew) {
      const cutoff = Date.now() - 24 * 60 * 60 * 1000;
      if (new Date(a.first_seen_at || 0).getTime() < cutoff) return false;
    }
    if (selectedBudget) {
      const minThb = selectedBudget.min * EUR_TO_THB;
      const maxThb = selectedBudget.max * EUR_TO_THB;
      const p = priceOf(a, durationField);
      if (p == null || p < minThb || p > maxThb) return false;
    }
    if (selectedAmenities.size) {
      const amenities = a.amenities || [];
      for (const am of selectedAmenities) {
        if (!amenities.includes(am)) return false;
      }
    }
    return true;
  });
  clusterGroup.clearLayers();
  clusterGroup.addLayers(filtered.map(a => markersById[a.id]).filter(Boolean));

  const countEl = document.getElementById("result-count");
  if (countEl) countEl.textContent = `${filtered.length.toLocaleString("fr-FR")} annonce${filtered.length > 1 ? "s" : ""}`;
}

async function loadAds(){
  const limit = 500;
  let offset = 0;
  const data = [];

  try {
    while (true) {
      const r = await fetch(`${API}/listings?status=active&limit=${limit}&offset=${offset}`);
      if (!r.ok) throw new Error(r.status);
      const batch = await r.json();
      if (!Array.isArray(batch)) throw new Error("Réponse /listings invalide");
      data.push(...batch);
      if (batch.length < limit) break;
      offset += limit;
    }
  } catch (e) {
    document.getElementById("leaflet-map").innerHTML =
      `<div class="empty">Impossible de charger les annonces pour le moment.<br><br>Le serveur met parfois une minute à démarrer : recharge la page dans quelques instants.</div>`;
    return;
  }

  ads = data.filter(a => Number.isFinite(a.latitude) && Number.isFinite(a.longitude));

  if (!ads.length) {
    document.getElementById("leaflet-map").innerHTML = `<div class="empty">Aucune annonce géolocalisée.</div>`;
    return;
  }

  buildMap();
  setupFormFilters();
  applyFilters();
}

// ── Modal (détail annonce, porté depuis index.html) ──

// ── Pagination ────────────────────────────────────────────────────────

async function openModal(id) {
  lastFocusedEl = document.activeElement;
  document.getElementById("overlay").classList.add("open");
  const body = document.getElementById("modal-body");
  body.innerHTML = `<div class="state-box"><div class="spinner"></div></div>`;
  body.focus();
  try {
    const l = await fetch(`${API}/listings/${id}`).then(r => r.json());
    body.innerHTML = modalHTML(l);
    currentGalleryImages = l.images || [];
  } catch(e) {
    body.innerHTML = `<div class="state-box">Erreur de chargement</div>`;
  }
}

document.getElementById("lightbox-overlay").addEventListener("touchstart", e => {
  lightboxTouchStartX = e.changedTouches[0].clientX;
}, { passive: true });
document.getElementById("lightbox-overlay").addEventListener("touchend", e => {
  if (lightboxTouchStartX === null) return;
  const delta = e.changedTouches[0].clientX - lightboxTouchStartX;
  lightboxTouchStartX = null;
  if (Math.abs(delta) < 40) return;
  navigateLightbox(delta > 0 ? -1 : 1);
}, { passive: true });

document.addEventListener("keydown", trapModalFocus);

// La carte ne charge pas les caches de geocodage d'index.html : seules les
// coordonnees propres de l'annonce servent (une annonce sans position
// n'apparait de toute facon pas sur la carte).
function mapPoint(l) {
  if (l.latitude != null && l.longitude != null) {
    return { lat: l.latitude, lon: l.longitude, precise: !l.location_approx };
  }
  return null;
}

function modalHTML(l) {
  const locs = [l.subdistrict, l.district, l.province].filter(Boolean);
  const amenities = l.amenities || [];
  const mapsUrl = googleMapsUrl(l);
  const embedUrl = googleMapsEmbedUrl(l);
  const pt = mapPoint(l);
  const precisionLabel = !pt ? ""
    : pt.precise ? "📌 Position précise"
    : l.location_approx ? "🔵 Position approximative (zone de ~350 m — connectez-vous pour la position exacte)"
    : "🔵 Position approximative (centre du quartier — RentHub ne publie pas l'adresse exacte)";

  return `
    <div class="modal-top">
      <button class="modal-close" onclick="closeModal()" aria-label="Fermer">✕</button>
    </div>
    ${l.images && l.images.length ? `
    <div class="modal-gallery">
      ${l.images.map((u, i) => `<div class="modal-gallery-item"><img src="${esc(u)}" alt="" loading="lazy" draggable="false" oncontextmenu="return false" onclick="openLightbox(${i})" onerror="this.parentElement.style.display='none'">${watermarkHTML()}</div>`).join("")}
    </div>` : ""}
    <div class="modal-tags">
      ${locs.map(loc => `<span class="tag">${esc(loc)}</span>`).join("")}
      ${l.has_monthly_contract === "true" && contractVal(l.contract_monthly_raw) !== "—" ? `<span class="badge badge-monthly" style="position:static;display:inline-block">1 MOIS</span>` : ""}
      ${contractVal(l.contract_3_month_raw) !== "—" ? `<span class="badge badge-term-3" style="position:static;display:inline-block">3 MOIS</span>` : ""}
      ${contractVal(l.contract_6_month_raw) !== "—" ? `<span class="badge badge-term-6" style="position:static;display:inline-block">6 MOIS</span>` : ""}
    </div>
    ${mapsUrl ? `
    <div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap">
        <a class="modal-link" style="padding:6px 12px;font-size:11px" href="${esc(mapsUrl)}" target="_blank" rel="noopener">📍 Google Maps ↗</a>
      </div>
      ${embedUrl ? `<iframe src="${esc(embedUrl)}" style="width:100%;height:220px;border:0;border-radius:8px;margin-top:10px" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Carte de localisation"></iframe>` : ""}
      ${precisionLabel ? `<div style="font-size:10px;color:var(--muted);margin-top:6px">${precisionLabel}</div>` : ""}
    </div>` : ""}
    <div>
      <div class="section-head">${esc(contractsSectionTitle(l))}</div>
      <div class="modal-contracts">
        ${renderContractsHTML(l)}
      </div>
    </div>
    ${l.deposit || (l.electric_price && l.electric_price !== "Please contact") || amenities.length ? `
    <div>
      <div class="section-head">Description</div>
      <div class="modal-contracts">
        <div class="mc"><div class="mc-label">Deposit</div><div class="mc-val${l.deposit ? "" : " na"}">${l.deposit ? esc(l.deposit) : "Non communiqué"}</div></div>
        ${l.electric_price && l.electric_price !== "Please contact" ? `<div class="mc"><div class="mc-label">Electric price</div><div class="mc-val">${esc(l.electric_price)}</div></div>` : ""}
        <div class="mc"><div class="mc-label">Air Conditioner</div><div class="mc-val${amenities.includes("Air Conditioner") ? "" : " na"}">${amenities.includes("Air Conditioner") ? "YES" : "NO"}</div></div>
      </div>
    </div>` : ""}
    ${amenities.length ? `
    <div>
      <div class="section-head">Équipements</div>
      <div class="modal-amenities">${amenities.map(a=>`<span class="amenity">${esc(AMENITY_ICONS[a] || a)}</span>`).join("")}</div>
    </div>` : ""}
    ${(()=>{const hasWa=hasRealWhatsapp(l.whatsapp);return l.phone||l.line_id||hasWa ? `
    <div>
      <div class="section-head">Contact</div>
      <div class="modal-contracts">
        ${l.phone?`<div class="mc"><div class="mc-label">Téléphone</div><div class="mc-val">📞 ${esc(l.phone)}</div></div>`:""}
        ${l.line_id?(()=>{
          // line_verified===false : identifiant deja confirme inexistant par
          // scripts/verify_line_ids.py -- on route vers line.me/ti/p/~<id>
          // pour eviter un 404 (voir Listing.line_verified). Sinon (valide ou
          // jamais verifie), page.line.me/<id> reste le lien qui marche vraiment.
          const slug = encodeURIComponent(String(l.line_id).replace(/^@/,""));
          const href = l.line_verified===false ? `https://line.me/ti/p/~${slug}` : `https://page.line.me/${slug}`;
          return `<a class="mc mc-line" href="${href}" target="_blank" rel="noopener"><div class="mc-label">LINE</div><div class="mc-val" style="display:flex;align-items:center;gap:6px">${LINE_ICON_SVG} ${esc(l.line_id)}</div></a>`;
        })():""}
        ${hasWa?`<a class="mc mc-wa" href="https://api.whatsapp.com/send/?phone=${encodeURIComponent(String(l.whatsapp).replace(/\D/g,""))}&text&type=phone_number&app_absent=0" target="_blank" rel="noopener"><div class="mc-label">WhatsApp</div><div class="mc-val" style="display:flex;align-items:center;gap:6px">${WHATSAPP_ICON_SVG} ${esc(formatWhatsapp(l.whatsapp))}</div></a>`:""}
      </div>
    </div>` : "";})()}
    <a class="modal-link" href="${esc(l.url)}" target="_blank" rel="noopener">Voir sur RentHub ↗</a>
  `;
}

document.addEventListener("keydown", e => {
  const lightboxOpen = document.getElementById("lightbox-overlay").classList.contains("open");
  if (lightboxOpen && e.key === "ArrowLeft") { navigateLightbox(-1); return; }
  if (lightboxOpen && e.key === "ArrowRight") { navigateLightbox(1); return; }
  if (e.key !== "Escape") return;
  if (lightboxOpen) { closeLightbox(); return; }
  closeModal();
});

// Pas de clic droit / glisser / selection sur les photos (popup de la carte,
// galerie de la modale, lightbox). Le popup Leaflet est insere dynamiquement,
// d'ou l'ecoute au niveau du document.
["contextmenu", "dragstart", "selectstart", "copy"].forEach(eventName => {
  document.addEventListener(eventName, event => {
    if (event.target.closest(".popup-photos-wrap, .modal-gallery, .lightbox-overlay")) event.preventDefault();
  });
});

loadAds();
</script>
