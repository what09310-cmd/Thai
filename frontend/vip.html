<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiMonth — Carte Thaïlande</title>
<meta property="og:title" content="ThaiMonth — Carte Thaïlande">
<meta property="og:description" content="Toutes les annonces actives géolocalisées en Thaïlande">
<meta property="og:image" content="/static/logo.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #faf8f4;
    --surface:  #ffffff;
    --card:     #ffffff;
    --border:   #e9e4da;
    --accent:   #5046f5;
    --accent-ink: #ffffff;
    --brand-lime: #c7ef6c;
    --brand-gold: #e8b765;
    --green:    #2f9e44;
    --text:     #14130f;
    --muted:    #6c6660;
    --dim:      #9b948b;
    --focus:    #5046f5;
    --mono:     'Plus Jakarta Sans', system-ui, sans-serif;
    --sans:     'Plus Jakarta Sans', system-ui, sans-serif;
    --r-pill:   9999px;
    --r-card:   20px;
    --r-ctl:    12px;
    --sky-1:    #cfe8b8;
    --sky-2:    #dcd6f9;
    --sky-3:    #cde8f4;
  }

  html,body{height:100%}
  body{ font-family:var(--sans);background:var(--bg);color:var(--text) }

  header{
    position:absolute;top:14px;left:14px;right:14px;
    width:auto;max-width:780px;margin:0 auto;
    padding:9px 10px 9px 22px;background:#1d3c10;border-radius:var(--r-pill);
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    box-shadow:0 10px 28px rgba(29,60,16,.28);z-index:2000
  }
  .logo{
    display:flex;align-items:center;text-decoration:none;
    font-family:var(--sans);font-size:25px;font-weight:800;
    letter-spacing:-.6px;line-height:1;flex-shrink:0
  }
  .logo-thai{ color:var(--brand-lime) }
  .logo-month{ color:var(--brand-gold) }
  .header-list{
    background:var(--accent);color:#fff;
    border-radius:var(--r-pill);padding:10px 20px;font-size:14px;font-weight:600;
    text-decoration:none;white-space:nowrap;transition:filter .15s;flex-shrink:0
  }
  .header-list:hover{ filter:brightness(1.12) }

  main{ height:100vh }

  #map{ position:relative;height:100%;background:var(--bg) }
  #leaflet-map{ width:100%; height:100% }
  .leaflet-tile-pane{ filter:saturate(.85) brightness(1.02) contrast(.96); }
  .leaflet-control-zoom a{ background:var(--card) !important;color:var(--text) !important;border-color:var(--border) !important }
  .leaflet-control-zoom a:hover{ background:var(--bg) !important }
  .leaflet-control-attribution{ background:rgba(255,255,255,.85) !important;color:var(--muted) !important }
  .leaflet-control-attribution a{ color:var(--accent) !important }

  .pin-icon{
    width:14px;height:14px;border-radius:50%;
    background:var(--accent);border:2px solid #fff;
    box-shadow:0 2px 6px rgba(20,19,15,.35);
  }

  .leaflet-popup-content{ font-family:var(--sans);font-size:13px;margin:10px 12px }
  .leaflet-popup-content-wrapper{ background:var(--card);color:var(--text);border-radius:var(--r-ctl);box-shadow:0 10px 30px rgba(20,19,15,.18) }
  .leaflet-popup-tip{ background:var(--card) }
  .popup-price{ font-weight:800;margin-bottom:6px;color:var(--accent);font-size:14px }
  .popup-info{ font-size:12px;color:var(--muted);margin-bottom:4px }
  .popup-amenities{ display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px }
  .popup-chip{
    background:var(--bg);border:1px solid var(--border);border-radius:var(--r-pill);
    padding:3px 9px;font-size:11px;color:var(--muted);white-space:nowrap
  }
  .popup-btn{
    display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;
    padding:8px 14px;border-radius:var(--r-pill);font-size:12px;font-weight:700;
    transition:opacity .15s
  }
  .popup-btn:hover{ opacity:.85 }
  .popup-actions{ display:flex;gap:6px;flex-wrap:wrap }
  .popup-btn.popup-btn-call{ background:var(--green) }

  .controls{
    position:absolute;top:14px;left:14px;z-index:1000;
    background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);
    box-shadow:0 10px 30px rgba(20,19,15,.12);
    padding:18px;width:270px;display:flex;flex-direction:column;gap:18px
  }

  .filter-section{ display:flex;flex-direction:column;gap:9px }
  .filter-label{
    font-size:11px;font-family:var(--mono);letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim)
  }
  .chip-group{ display:flex;flex-wrap:wrap;gap:8px }
  .chip{
    padding:8px 13px;border-radius:var(--r-pill);border:1.5px solid var(--border);
    background:var(--card);color:var(--muted);font-family:var(--sans);
    font-size:12.5px;font-weight:600;cursor:pointer;transition:all .15s
  }
  .chip:hover{ border-color:var(--accent);color:var(--text) }
  .chip.active{
    background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;
    box-shadow:0 3px 10px rgba(80,70,245,.28)
  }

  .budget-values{
    display:flex;justify-content:space-between;font-size:12px;
    font-family:var(--mono);color:var(--text)
  }
  .budget-values #budget-min-label, .budget-values #budget-max-label{ color:var(--accent);font-weight:700 }
  .range-slider{ position:relative;height:28px;margin-top:2px }
  .range-slider .range-track{
    position:absolute;top:50%;left:0;right:0;height:6px;
    transform:translateY(-50%);background:var(--border);border-radius:999px
  }
  .range-slider .range-fill{
    position:absolute;top:50%;height:6px;
    transform:translateY(-50%);background:var(--accent);border-radius:999px
  }
  .range-slider input[type="range"]{
    position:absolute;top:0;left:0;width:100%;height:28px;margin:0;
    background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none
  }
  .range-slider input[type="range"]::-webkit-slider-runnable-track{
    -webkit-appearance:none;background:transparent
  }
  .range-slider input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;pointer-events:auto;
    width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:3px solid #fff;cursor:pointer;
    box-shadow:0 1px 4px rgba(20,19,15,.3);margin-top:5px
  }
  .range-slider input[type="range"]::-moz-range-track{ background:transparent;border:none }
  .range-slider input[type="range"]::-moz-range-thumb{
    pointer-events:auto;width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:3px solid #fff;cursor:pointer;
    box-shadow:0 1px 4px rgba(20,19,15,.3)
  }

  .empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;text-align:center;padding:20px;background:var(--bg)
  }

  @media (max-width: 640px){
    header{ left:10px;right:10px;top:10px;padding:8px 8px 8px 18px;gap:10px }
    .logo{ font-size:20px }
    .header-list{ padding:8px 14px;font-size:12px }
    .controls{
      left:10px;right:10px;top:76px;width:auto;
      max-height:calc(100% - 86px);overflow-y:auto
    }
  }
</style>
<script src="/static/auth-header.js" defer></script>
</head>
<body>

<header>
  <a class="logo" href="/" aria-label="ThaiMonth">
    <span class="logo-thai">Thai</span><span class="logo-month">Month</span>
  </a>
  <a class="header-list" href="/">Voir la liste</a>
</header>

<main>
  <section id="map">
    <div id="leaflet-map"></div>
    <div class="controls">
      <div class="filter-section">
        <div class="filter-label">Résultats</div>
        <div class="budget-values"><span id="result-count">— annonces</span></div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Budget (€ / mois)</div>
        <div class="budget-values">
          <span id="budget-min-label">10 €</span>
          <span id="budget-max-label">500 €+</span>
        </div>
        <div class="range-slider" id="f-budget">
          <div class="range-track"></div>
          <div class="range-fill" id="budget-fill"></div>
          <input type="range" id="budget-min" min="10" max="500" step="10" value="10">
          <input type="range" id="budget-max" min="10" max="500" step="10" value="500">
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Durée du séjour</div>
        <div class="chip-group" id="f-duration">
          <button type="button" class="chip" data-value="1 mois">1 mois</button>
          <button type="button" class="chip" data-value="3 mois">3 mois</button>
          <button type="button" class="chip" data-value="6 mois">6 mois</button>
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Équipements</div>
        <div class="chip-group" id="f-amenities">
          <button type="button" class="chip" id="chip-new">🆕 New</button>
          <button type="button" class="chip" data-value="Pool">🏊 Pool</button>
          <button type="button" class="chip" data-value="Fitness">🏋️ Fitness</button>
          <button type="button" class="chip" data-value="Desk">🖥️ Desk</button>
          <button type="button" class="chip" data-value="In-room WIFI">📶 WIFI</button>
          <button type="button" class="chip" data-value="Television">📺 TV</button>
          <button type="button" class="chip" data-value="Beauty Salon in Building">💇 Beautiful</button>
          <button type="button" class="chip" data-value="Parking">🅿️ Parking</button>
          <button type="button" class="chip" data-value="Smoking">🚬 Smoking</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/map.js"></script>
<script>

function pinIcon(){
  return L.divIcon({ className: "", html: `<div class="pin-icon"></div>`, iconSize: [12, 12] });
}

function buildMap(){
  leafletMap = L.map("leaflet-map", { zoomControl: false });
  L.control.zoom({ position: "topright" }).addTo(leafletMap);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19,
  }).addTo(leafletMap);

  clusterGroup = L.markerClusterGroup({ maxClusterRadius: 50 });
  leafletMap.addLayer(clusterGroup);

  ads.forEach(ad => {
    const price = priceLabel(ad);
    const hasAc = (ad.amenities || []).includes("Air Conditioner");
    const chips = amenityChips(ad);
    const marker = L.marker([ad.latitude, ad.longitude], { icon: pinIcon() })
      .bindPopup(
        `<div class="popup-price">${price ? escapeHtml(price) + " / mois" : "Prix non disponible"}</div>` +
        `<div class="popup-info">Deposit: ${ad.deposit ? escapeHtml(ad.deposit) : "—"}</div>` +
        `<div class="popup-info">Air Conditioner : ${hasAc ? "Oui" : "Non"}</div>` +
        (chips.length ? `<div class="popup-amenities">${chips.map(c => `<span class="popup-chip">${escapeHtml(AMENITY_ICONS[c])}</span>`).join("")}</div>` : "") +
        `<div class="popup-actions">` +
        `<a href="${escapeHtml(ad.url)}" target="_blank" rel="noopener" class="popup-btn">Voir l'annonce complète</a>` +
        (ad.phone ? `<a href="tel:${escapeHtml(ad.phone)}" class="popup-btn popup-btn-call">📞 Appeler</a>` : "") +
        `</div>`
      );
    markersById[ad.id] = marker;
  });

  const bounds = L.latLngBounds(ads.map(a => [a.latitude, a.longitude]));
  leafletMap.fitBounds(bounds, { padding: [30, 30] });
}

function applyFilters(){
  const durationField = DURATION_FIELD[selectedDuration] || null;

  const filtered = ads.filter(a => {
    if (durationField && !hasRaw(a[`${durationField}_raw`])) return false;
    if (onlyNew) {
      const cutoff = Date.now() - 24 * 60 * 60 * 1000;
      if (new Date(a.first_seen_at || 0).getTime() < cutoff) return false;
    }
    if (selectedBudget) {
      const minThb = selectedBudget.min * EUR_TO_THB;
      const maxThb = selectedBudget.max * EUR_TO_THB;
      const p = priceOf(a, durationField);
      if (p == null || p < minThb || p > maxThb) return false;
    }
    if (selectedAmenities.size) {
      const amenities = a.amenities || [];
      for (const am of selectedAmenities) {
        if (!amenities.includes(am)) return false;
      }
    }
    return true;
  });
  clusterGroup.clearLayers();
  clusterGroup.addLayers(filtered.map(a => markersById[a.id]).filter(Boolean));

  const countEl = document.getElementById("result-count");
  if (countEl) countEl.textContent = `${filtered.length.toLocaleString("fr-FR")} annonce${filtered.length > 1 ? "s" : ""}`;
}

async function loadAds(){
  const limit = 500;
  let offset = 0;
  const data = [];

  try {
    while (true) {
      const r = await fetch(`${API}/listings?status=active&limit=${limit}&offset=${offset}`);
      if (!r.ok) throw new Error(r.status);
      const batch = await r.json();
      if (!Array.isArray(batch)) throw new Error("Réponse /listings invalide");
      data.push(...batch);
      if (batch.length < limit) break;
      offset += limit;
    }
  } catch (e) {
    document.getElementById("leaflet-map").innerHTML =
      `<div class="empty">Impossible de charger les annonces pour le moment.<br><br>Le serveur met parfois une minute à démarrer : recharge la page dans quelques instants.</div>`;
    return;
  }

  ads = data.filter(a => Number.isFinite(a.latitude) && Number.isFinite(a.longitude));

  if (!ads.length) {
    document.getElementById("leaflet-map").innerHTML = `<div class="empty">Aucune annonce géolocalisée.</div>`;
    return;
  }

  buildMap();
  setupFormFilters();
  applyFilters();
}

loadAds();
</script>
</body>
</html>
