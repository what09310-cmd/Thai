<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiMonth — Carte Thaïlande</title>
<meta property="og:title" content="ThaiMonth — Carte Thaïlande">
<meta property="og:description" content="Toutes les annonces actives géolocalisées en Thaïlande">
<meta property="og:image" content="/static/logo.png">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      integrity="sha256-YU3qCpj/P06tdPBJGPax0bm6Q1wltfwjsho5TR4+TYc=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      integrity="sha256-YSWCMtmNZNwqex4CEw1nQhvFub2lmU7vcCKP+XVwwXA=" crossorigin="">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/css/map.css">
<link rel="stylesheet" href="/static/css/common.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #faf8f4;
    --surface:  #ffffff;
    --card:     #ffffff;
    --border:   #e9e4da;
    --accent:   #5046f5;
    --accent-ink: #ffffff;
    --brand-lime: #c7ef6c;
    --brand-gold: #e8b765;
    --green:    #2f9e44;
    --text:     #14130f;
    --muted:    #6c6660;
    --dim:      #9b948b;
    --focus:    #5046f5;
    --mono:     'Plus Jakarta Sans', system-ui, sans-serif;
    --sans:     'Plus Jakarta Sans', system-ui, sans-serif;
    --r-pill:   9999px;
    --r-card:   20px;
    --r-ctl:    12px;
    --sky-1:    #cfe8b8;
    --sky-2:    #dcd6f9;
    --sky-3:    #cde8f4;
  }
  .popup-price{ font-weight:800;margin-bottom:6px;color:var(--accent);font-size:14px }
  .popup-info{ font-size:12px;color:var(--muted);margin-bottom:4px }
  .popup-amenities{ display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px }
  .popup-chip{
    background:var(--bg);border:1px solid var(--border);border-radius:var(--r-pill);
    padding:3px 9px;font-size:11px;color:var(--muted);white-space:nowrap
  }
  .popup-btn{
    display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;
    padding:8px 14px;border-radius:var(--r-pill);font-size:12px;font-weight:700;
    transition:opacity .15s
  }
  .popup-btn:hover{ opacity:.85 }
  .popup-actions{ display:flex;gap:6px;flex-wrap:wrap }
  .popup-btn.popup-btn-call{ background:#237a35 }
  .popup-btn.popup-btn-line{ background:#048848;color:#fff }
  .popup-btn.popup-btn-wa{ background:#0f7d5c;color:#fff }
</style>
<script src="/static/auth-header.js" defer></script>
</head>
<body>

<header>
  <a class="logo" href="/123" aria-label="ThaiMonth">
    <span class="logo-thai">Thai</span><span class="logo-month">Month</span>
  </a>
  <a class="header-list" href="/123">Voir la liste</a>
</header>

<main>
  <section id="map">
    <div id="leaflet-map"></div>
    <div class="controls">
      <div class="filter-section">
        <div class="filter-label">Résultats</div>
        <div class="budget-values"><span id="result-count">— annonces</span></div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Budget (€ / mois)</div>
        <div class="budget-values">
          <span id="budget-min-label">10 €</span>
          <span id="budget-max-label">500 €+</span>
        </div>
        <div class="range-slider" id="f-budget">
          <div class="range-track"></div>
          <div class="range-fill" id="budget-fill"></div>
          <input type="range" id="budget-min" min="10" max="500" step="10" value="10">
          <input type="range" id="budget-max" min="10" max="500" step="10" value="500">
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Durée du séjour</div>
        <div class="chip-group" id="f-duration">
          <button type="button" class="chip" data-value="1 mois">1 mois</button>
          <button type="button" class="chip" data-value="3 mois">3 mois</button>
          <button type="button" class="chip" data-value="6 mois">6 mois</button>
        </div>
      </div>
      <div class="filter-section">
        <div class="filter-label">Équipements</div>
        <div class="chip-group" id="f-amenities">
          <button type="button" class="chip" id="chip-new">🆕 New</button>
          <button type="button" class="chip" data-value="Pool">🏊 Pool</button>
          <button type="button" class="chip" data-value="Fitness">🏋️ Fitness</button>
          <button type="button" class="chip" data-value="Desk">🖥️ Desk</button>
          <button type="button" class="chip" data-value="In-room WIFI">📶 WIFI</button>
          <button type="button" class="chip" data-value="Television">📺 TV</button>
          <button type="button" class="chip" data-value="Beauty Salon in Building">💇 Beautiful</button>
          <button type="button" class="chip" data-value="Parking">🅿️ Parking</button>
          <button type="button" class="chip" data-value="Smoking">🚬 Smoking</button>
          <button type="button" class="chip" data-value="LINE">LINE</button>
          <button type="button" class="chip" data-value="WhatsApp">WhatsApp</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
        integrity="sha256-Hk4dIpcqOSb0hZjgyvFOP+cEmDXUKKNE/tT542ZbNQg=" crossorigin="" defer></script>
<script src="/static/js/common.js"></script>
<script src="/static/js/map.js"></script>
<script src="/static/js/thai-map.js"></script>
<script>

function buildMap(){
  leafletMap = L.map("leaflet-map", { zoomControl: false });
  L.control.zoom({ position: "topright" }).addTo(leafletMap);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19,
  }).addTo(leafletMap);

  clusterGroup = L.markerClusterGroup({ maxClusterRadius: 50 });
  leafletMap.addLayer(clusterGroup);

  ads.forEach(ad => {
    const price = priceLabel(ad);
    const hasAc = (ad.amenities || []).includes("Air Conditioner");
    const chips = amenityChips(ad);
    const marker = L.marker([ad.latitude, ad.longitude], { icon: pinIcon() })
      .bindPopup(
        `<div class="popup-price">${price ? escapeHtml(price) + " / mois" : "Prix non disponible"}</div>` +
        `<div class="popup-info">Deposit: ${ad.deposit ? escapeHtml(ad.deposit) : "—"}</div>` +
        `<div class="popup-info">Air Conditioner : ${hasAc ? "Oui" : "Non"}</div>` +
        (chips.length ? `<div class="popup-amenities">${chips.map(c => `<span class="popup-chip">${escapeHtml(AMENITY_ICONS[c])}</span>`).join("")}</div>` : "") +
        `<div class="popup-actions">` +
        `<a href="${safeHref(ad.url)}" target="_blank" rel="noopener" class="popup-btn">Voir l'annonce complète</a>` +
        (ad.phone ? `<a href="tel:${escapeHtml(String(ad.phone).replace(/[^+\d]/g,""))}" class="popup-btn popup-btn-call">📞 ${escapeHtml(ad.phone)}</a>` : "") +
        (ad.line_id ? (() => {
          // Meme regle que modal.js: line_verified===false route vers
          // line.me/ti/p/~<id> (identifiant deja confirme inexistant),
          // sinon page.line.me/<id> qui marche vraiment.
          const slug = encodeURIComponent(String(ad.line_id).replace(/^@/, ""));
          const href = ad.line_verified === false ? `https://line.me/ti/p/~${slug}` : `https://page.line.me/${slug}`;
          return `<a href="${href}" target="_blank" rel="noopener" class="popup-btn popup-btn-line">LINE</a>`;
        })() : "") +
        (ad.whatsapp && String(ad.whatsapp).replace(/\D/g, "").length >= 5
          ? `<a href="https://api.whatsapp.com/send/?phone=${encodeURIComponent(String(ad.whatsapp).replace(/\D/g,""))}&text&type=phone_number&app_absent=0" target="_blank" rel="noopener" class="popup-btn popup-btn-wa">WhatsApp</a>`
          : "") +
        `</div>`
      );
    markersById[ad.id] = marker;
  });

  const bounds = L.latLngBounds(ads.map(a => [a.latitude, a.longitude]));
  leafletMap.fitBounds(bounds, { padding: [30, 30] });
}

document.addEventListener("DOMContentLoaded", () => loadAds());
</script>
</body>
</html>
